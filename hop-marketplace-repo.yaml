#
# Hop marketplace repository definition for hop-datavault (Hop 2.19+).
#
# Jenkins publishes continuous SNAPSHOT zips to this Nexus after project changes.
# Import into Hop so the plugin appears in marketplace query / install:
#
#   ./hop marketplace repo import \
#     https://raw.githubusercontent.com/mattcasters/hop-data-vault/refs/heads/main/hop-marketplace-repo.yaml
#   # or a local path: ./hop marketplace repo import hop-marketplace-repo.yaml
#
#   ./hop marketplace query | grep vault
#   ./hop marketplace install hop-datavault
#
# browse: true → Hop lists *.zip from this Nexus live (no cache).
# plugins: optional metadata that enriches names/categories and can pin version.
# Restart Hop after install so the plugin registry reloads.
#
schemaVersion: "1.0"
kind: hop-marketplace-repository

id: data-hopper-community
name: Data Hopper Community Plugins
url: https://repository.data-hopper.com/repository/hop-community-plugins/
primary: false
enabled: true
browse: true
includeSnapshots: true
homepage: https://github.com/mattcasters/hop-data-vault
description: >
  Community Maven repository with continuous Jenkins builds of hop-datavault
  (Data Vault 2.0, Business Vault, and dimensional modeling for Apache Hop).

# Optional metadata (enriches live Nexus list; not a cache)
# minHopVersion: only show when the running Hop is >= this version
# version: pin of the published base version (Nexus resolves latest SNAPSHOT timestamp)
plugins:
  - groupId: org.apache.hop
    artifactId: hop-datavault
    version: 0.8.0
    minHopVersion: "2.19.0"
    name: Data Vault
    category: Community
    description: >
      Data Vault 2.0, Business Vault, and dimensional modeling for Apache Hop
    installPath: plugins/misc/datavault
