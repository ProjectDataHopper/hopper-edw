#
# Hop marketplace repository definition for hopper-edw (Data Hopper EDW, Hop 2.19+).
#
# Jenkins publishes continuous SNAPSHOT zips to this Nexus after project changes.
# Import into Hop so the plugin appears in marketplace query / install:
#
#   ./hop marketplace repo import \
#     https://raw.githubusercontent.com/ProjectDataHopper/hopper-edw/refs/heads/main/hop-marketplace-repo.yaml
#   # or a local path: ./hop marketplace repo import hop-marketplace-repo.yaml
#
#   ./hop marketplace query | grep -i hopper
#   ./hop marketplace install hopper-edw
#
# browse: true → Hop lists *.zip from this Nexus live (no cache).
# plugins: optional metadata that enriches names/categories and can pin version.
# Restart Hop after install so the plugin registry reloads.
#
# Cutover: 0.9.0 and earlier were published as org.apache.hop:hop-datavault
# and unpacked to plugins/misc/datavault. Remove that folder before installing hopper-edw.
#
schemaVersion: "1.0"
kind: hop-marketplace-repository

id: data-hopper-community
name: Data Hopper Community Plugins
url: https://repository.data-hopper.com/repository/hop-community-plugins/
primary: false
enabled: true
browse: true
includeSnapshots: true
homepage: https://github.com/ProjectDataHopper/hopper-edw
description: >
  Community Maven repository with Project Data Hopper plugins for Apache Hop,
  including Data Hopper EDW (source models, Data Vault 2.0, Business Vault,
  dimensional models, quality, and lineage).

# Optional metadata (enriches live Nexus list; not a cache)
# minHopVersion: only show when the running Hop is >= this version
# version: pin of the published base version (Nexus resolves latest SNAPSHOT timestamp)
plugins:
  - groupId: org.hopper
    artifactId: hopper-edw
    version: 0.10.0
    minHopVersion: "2.19.0"
    name: Data Hopper EDW
    category: Community
    description: >
      Apache Hop plugins to build an Enterprise Data Warehouse: source models,
      Data Catalog, Data Vault 2.0, Business Vault, dimensional models, quality,
      and lineage.
    installPath: plugins/misc/hopper-edw
