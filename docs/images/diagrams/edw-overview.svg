<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-laid poster. Rows are positioned by hand. There is no .puml. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="708" viewBox="0 0 1280 708" role="img">
<title>Data Hopper EDW overview</title>
<desc>Landing databases, files, and JSON feed a source model. Clients query that model through Hop JDBC. Hop loads the Data Vault, Business Vault, and dimensional databases from their model files and records OPS metrics and lineage. The coach moves from one model to the next. Generate Data Vault builds the raw vault from the source model. Hopper presentations report from the dimensional model. The catalog sits under every model. Documentation, the EDW Journey, and the lineage view sit on that catalog. A harvester watches live schemas and the catalog.</desc>
