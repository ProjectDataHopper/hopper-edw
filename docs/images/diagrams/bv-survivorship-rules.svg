e-width:1;" width="121.5687" x="37" y="175.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.5687" x="47" y="198.396">sat_person_oracle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.9883" x="47" y="214.7401">Rank = 2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.6047" x="47" y="231.0842">Null policy: apply</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="56.3644" x="47" y="247.4283">Mode: full</text></g><!--entity InSeed--><g class="entity" data-entity="InSeed" data-source-line="22" data-uid="ent0005" id="entity_InSeed"><rect fill="#FFF6E8" height="85.3765" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="113.6607" x="41" y="278.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.6607" x="51" y="301.396">sat_person_seed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.9883" x="51" y="317.7401">Rank = 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.3127" x="51" y="334.0842">Operation: seed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="65.2925" x="51" y="350.4283">Mode: seed</text></g><!--entity Ranks--><g class="entity" data-entity="Ranks" data-source-line="26" data-uid="ent0007" id="entity_Ranks"><rect fill="#F3EBFB" height="69.0323" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="206.6853" x="219" y="183.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.3647" x="229" y="206.396">Rank Arbitration</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.141" x="229" y="222.7401">Rank 1 wins over Rank 2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.6853" x="229" y="239.0842">(Ranks can disagree per column!)</text></g><!--entity Nulls--><g class="entity" data-entity="Nulls" data-source-line="27" data-uid="ent0008" id="entity_Nulls"><rect fill="#FFF6E8" height="69.0323" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="216.5374" x="462" y="187.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.6491" x="472" y="210.396">Null Policy: inherit vs apply</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.5374" x="472" y="226.7401">inherit: skip null &amp; keep prior value</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.5733" x="472" y="243.0842">apply: write null &amp; clear attribute</text></g><!--entity Flags--><g class="entity" data-entity="Flags" data-source-line="28" data-uid="ent0009" id="entity_Flags"><rect fill="#EDF0F4" height="69.0323" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="231.8135" x="715" y="189.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.0572" x="725" y="212.396">Present Flags (Sparse Feeds)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.1454" x="725" y="228.7401">flag = 'N': field omitted (keep value)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.8135" x="725" y="245.0842">flag = 'Y': explicitly cleared (apply null)</text></g><!--entity Ops--><g class="entity" data-entity="Ops" data-source-line="29" data-uid="ent0010" id="entity_Ops"><rect fill="#E8F0FB" height="85.3765" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="243.1176" x="983" y="183.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.6166" x="993" y="206.396">Leg Operations</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.741" x="993" y="222.7401">upsert: standard update</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.1176" x="993" y="239.0842">seed: fills gaps, never overwrites upsert</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.8415" x="993" y="255.4283">delete: withdraws source contribution</text></g><!--entity Emit--><g class="entity" data-entity="Emit" data-source-line="33" data-uid="ent0012" id="entity_Emit"><rect fill="#E7F6ED" height="85.3765" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="268.4378" x="1262" y="183.5679"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3768" x="1272" y="206.396">Surviving Target Row</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.597" x="1272" y="222.7401">Kafka email wins (Rank 1)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.0778" x="1272" y="239.0842">Oracle city preserved when Kafka sends null</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.4378" x="1272" y="255.4283">Emitted ONLY when surviving state changes</text></g><g class="link" data-entity-1="InKaf" data-entity-2="Ranks" data-uid="lnk13" id="link_InKaf_Ranks"><polygon fill="#5A6A7E" points="246.9297,183.5477,240.4427,176.137,242.3923,181.4473,237.082,183.3968,246.9297,183.5477" style="stroke:#5A6A7E;stroke-width:1;"/><path d="M159.2117,142.9412 C186.2387,155.4526 212.9517,167.8186 241.4848,181.0272" fill="none" style="stroke:#5A6A7E;stroke-width:1;"/></g><g class="link" data-entity-1="InOra" data-entity-2="Ranks" data-ui