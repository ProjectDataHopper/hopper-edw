summary:
  en: >
    Generate Data Vault proposes hubs, links, and satellites from
    source-tables-crm.hsm. Review the list, apply it, and check the model.
    The drawing is retail-360.hdv. Tables and pipelines come later.
  zh-CN: >
    Generate Data Vault 从 source-tables-crm.hsm 提出枢纽、链接和卫星。复查清单，应用它，然后检查模型。这张图是 retail-360.hdv。数据库表和加载流程以后才出现。
  es-ES: >
    Generate Data Vault propone hubs, enlaces y satélites a partir de
    source-tables-crm.hsm. Revisa la lista, aplícala y comprueba el modelo.
    El dibujo es retail-360.hdv. Las tablas y los flujos de carga vienen después.
  pt-PT: >
    Generate Data Vault propõe hubs, ligações e satélites a partir de
    source-tables-crm.hsm. Revê a lista, aplica-a e verifica o modelo.
    O desenho é retail-360.hdv. As tabelas e os fluxos de carga vêm depois.
  fr-FR: >
    Generate Data Vault propose des hubs, des liens et des satellites à partir
    de source-tables-crm.hsm. Relis la liste, applique-la et contrôle le modèle.
    Le dessin est retail-360.hdv. Les tables et les chargements viennent ensuite.
  de-DE: >
    Generate Data Vault schlägt Hubs, Links und Satellites aus
    source-tables-crm.hsm vor. Prüfe die Liste, wende sie an und kontrolliere
    das Modell. Die Zeichnung ist retail-360.hdv. Tabellen und Ladeabläufe kommen später.
  it-IT: >
    Generate Data Vault propone hub, link e satelliti da source-tables-crm.hsm.
    Rivedi l'elenco, applicalo e controlla il modello. Il disegno è
    retail-360.hdv. Tabelle e caricamenti arrivano dopo.
