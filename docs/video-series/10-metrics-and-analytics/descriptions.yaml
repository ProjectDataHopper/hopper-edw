summary:
  en: >
    The last video. Open This run and History for a retail-sources load,
    then Create operational analytics on the OPS database. A Hop Lineage
    View shows where f_orders came from. An execution map is the picture
    of one run.
  zh-CN: >
    最后一集。打开一次 retail-sources 加载的 This run 和 History，然后在 OPS 数据库上使用 Create operational analytics。Hop Lineage View 显示 f_orders 从哪里来。执行图是一次运行的画面。
  es-ES: >
    El último vídeo. Abre This run y History de una carga de retail-sources,
    y luego Create operational analytics sobre la base OPS. Una Hop Lineage
    View muestra de dónde viene f_orders. Un mapa de ejecución es la imagen
    de una ejecución.
  pt-PT: >
    O último vídeo. Abre This run e History de uma carga de retail-sources,
    e depois Create operational analytics sobre a base OPS. Uma Hop Lineage
    View mostra de onde vem f_orders. Um mapa de execução é a imagem de uma
    execução.
  fr-FR: >
    La dernière vidéo. Ouvre This run et History d'un chargement
    retail-sources, puis Create operational analytics sur la base OPS.
    Une Hop Lineage View montre d'où vient f_orders. Une carte d'exécution
    est l'image d'une exécution.
  de-DE: >
    Das letzte Video. Öffne This run und History für einen retail-sources
    Ladevorgang, dann Create operational analytics auf der OPS-Datenbank.
    Eine Hop Lineage View zeigt, woher f_orders kommt. Eine Ausführungskarte
    ist das Bild eines Laufs.
  it-IT: >
    L'ultimo video. Apri This run e History di un carico di retail-sources,
    poi Create operational analytics sul database OPS. Una Hop Lineage View
    mostra da dove arriva f_orders. Una mappa di esecuzione è l'immagine di
    un'esecuzione.
