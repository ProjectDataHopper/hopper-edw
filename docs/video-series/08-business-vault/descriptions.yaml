summary:
  en: >
    The Business Vault stores business rules as their own tables. Open
    retail-360.hbv and the customer 360 SCD2, built from hub_customer and
    four raw satellites. Add the file to the same group, retail-sources.
  zh-CN: >
    Business Vault 把业务规则存成自己的表。打开 retail-360.hbv 和客户 360 SCD2，它由 hub_customer 和四颗原始卫星建成。把文件加进同一个组 retail-sources。
  es-ES: >
    El Business Vault guarda las reglas de negocio como tablas propias. Abre
    retail-360.hbv y el SCD2 de cliente 360, construido desde hub_customer y
    cuatro satélites en bruto. Añade el archivo al mismo grupo, retail-sources.
  pt-PT: >
    O Business Vault guarda as regras de negócio como tabelas próprias. Abre
    retail-360.hbv e o SCD2 de cliente 360, construído a partir de hub_customer
    e quatro satélites em bruto. Acrescenta o ficheiro ao mesmo grupo, retail-sources.
  fr-FR: >
    Le Business Vault range les règles métier dans leurs propres tables. Ouvre
    retail-360.hbv et le SCD2 client 360, construit depuis hub_customer et
    quatre satellites bruts. Ajoute le fichier au même groupe, retail-sources.
  de-DE: >
    Der Business Vault speichert Geschäftsregeln als eigene Tabellen. Öffne
    retail-360.hbv und das Kunden-360-SCD2, gebaut aus hub_customer und vier
    rohen Satellites. Füge die Datei derselben Gruppe hinzu, retail-sources.
  it-IT: >
    Il Business Vault conserva le regole di business come tabelle proprie. Apri
    retail-360.hbv e l'SCD2 cliente 360, costruito da hub_customer e quattro
    satelliti grezzi. Aggiungi il file allo stesso gruppo, retail-sources.
