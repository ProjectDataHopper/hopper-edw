  en: Source models
  zh-CN: 源模型
  es-ES: Modelos de origen
  pt-PT: Modelos de origem
  fr-FR: Modèles source
  de-DE: Quellenmodelle
  it-IT: Modelli di origine
summary:
  en: >
    A source model is the picture of one source system. Open
    source-tables-crm.hsm, see the tables and relationships, then Push to
    catalog. A query card is where a join lives.
  zh-CN: >
    源模型是一个源系统的图。打开 source-tables-crm.hsm，看见表和关系，然后
    Push to catalog。查询卡片是连接所在的地方。
  es-ES: >
    Un modelo de origen es la imagen de un sistema de origen. Abre
    source-tables-crm.hsm, mira las tablas y las relaciones, y luego Push to
    catalog. Una tarjeta de consulta es donde vive un join.
  pt-PT: >
    Um modelo de origem é a imagem de um sistema de origem. Abre
    source-tables-crm.hsm, vê as tabelas e as relações, e depois Push to
    catalog. Um cartão de consulta é onde vive um join.
  fr-FR: >
    Un modèle source est l'image d'un système source. Ouvre
    source-tables-crm.hsm, regarde les tables et les relations, puis Push to
    catalog. Une carte de requête est l'endroit où vit une jointure.
  de-DE: >
    Ein Quellenmodell ist das Bild eines Quellsystems. Öffne
    source-tables-crm.hsm, sieh die Tabellen und Beziehungen, dann Push to
    catalog. Eine Abfragekarte ist der Ort, an dem ein Join lebt.
  it-IT: >
    Un modello di origine è l'immagine di un sistema di origine. Apri
    source-tables-crm.hsm, guarda le tabelle e le relazioni, poi Push to
    catalog. Una scheda di query è il posto in cui vive un join.
