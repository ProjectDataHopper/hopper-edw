# Narration for video 04. English is the source.
# Product words stay in English. See docs/video-series/glossary.yaml.
video:
  id: 04-source-models
  title: "Source models"
  issue: 228
  width: 1920
  height: 1080
  fps: 30
  transition: fade
  transition_ms: 400
  padding_after_sec: 0.4
  voice_id: ara
  locales:
    - en
    - zh-CN
    - es-ES
    - pt-PT
    - fr-FR
    - de-DE
    - it-IT
