title:
  en: Updating a resource definition group
  zh-CN: 更新 resource definition group
  es-ES: Actualizar un resource definition group
  pt-PT: Atualizar um resource definition group
  fr-FR: Mettre à jour un resource definition group
  de-DE: Eine resource definition group aktualisieren
  it-IT: Aggiornare un resource definition group
summary:
  en: >
    Update resource definition group loads every model on retail-sources.
    A first load creates the vault tables and publishes the layouts. Later
    runs insert new keys and new satellite versions.
  zh-CN: >
    Update resource definition group 加载 retail-sources 上的每个模型。第一次加载创建 vault 表并发布布局。后来的运行插入新的键和新的卫星版本。
  es-ES: >
    Update resource definition group carga cada modelo de retail-sources.
    Una primera carga crea las tablas del vault y publica los diseños. Las
    siguientes insertan claves nuevas y versiones nuevas de satélite.
  pt-PT: >
    Update resource definition group carrega cada modelo de retail-sources.
    Uma primeira carga cria as tabelas do vault e publica os layouts. As
    seguintes inserem chaves novas e versões novas de satélite.
  fr-FR: >
    Update resource definition group charge chaque modèle de retail-sources.
    Un premier chargement crée les tables du vault et publie les dispositions.
    Les suivants insèrent de nouvelles clés et de nouvelles versions de satellite.
  de-DE: >
    Update resource definition group lädt jedes Modell von retail-sources.
    Ein erster Lauf legt die Vault-Tabellen an und veröffentlicht die Layouts.
    Spätere Läufe fügen neue Schlüssel und neue Satellite-Versionen ein.
  it-IT: >
    Update resource definition group carica ogni modello di retail-sources.
    Un primo carico crea le tabelle del vault e pubblica i layout. I successivi
    inseriscono chiavi nuove e nuove versioni di satellite.
