title:
  en: Install and configure Data Hopper EDW
  zh-CN: 安装并配置 Data Hopper EDW
  es-ES: Instalar y configurar Data Hopper EDW
  pt-PT: Instalar e configurar o Data Hopper EDW
  fr-FR: Installer et configurer Data Hopper EDW
  de-DE: Data Hopper EDW installieren und einrichten
  it-IT: Installare e configurare Data Hopper EDW
summary:
  en: >
    Install the Data Hopper EDW plugin on Apache Hop 2.20 with Java 21, then
    run Configure EDW setup. The dialog creates local-catalog and four shared
    configurations. It does not create a resource definition group.
  zh-CN: >
    在 Apache Hop 2.20 和 Java 21 上安装 Data Hopper EDW 插件，然后运行
    Configure EDW setup。对话框创建 local-catalog 和四个共享配置。它不会创建
    resource definition group。
  es-ES: >
    Instala el plugin Data Hopper EDW en Apache Hop 2.20 con Java 21 y ejecuta
    Configure EDW setup. El diálogo crea local-catalog y cuatro configuraciones
    compartidas. No crea un resource definition group.
  pt-PT: >
    Instala o plugin Data Hopper EDW no Apache Hop 2.20 com Java 21 e executa
    Configure EDW setup. O diálogo cria local-catalog e quatro configurações
    partilhadas. Não cria um resource definition group.
  fr-FR: >
    Installe le plugin Data Hopper EDW sur Apache Hop 2.20 avec Java 21, puis
    lance Configure EDW setup. La boîte de dialogue crée local-catalog et
    quatre configurations partagées. Elle ne crée pas de resource definition group.
  de-DE: >
    Installiere das Data Hopper EDW Plugin auf Apache Hop 2.20 mit Java 21 und
    starte Configure EDW setup. Der Dialog erzeugt local-catalog und vier
    gemeinsame Konfigurationen. Er erzeugt keine resource definition group.
  it-IT: >
    Installa il plugin Data Hopper EDW su Apache Hop 2.20 con Java 21, poi
    avvia Configure EDW setup. La finestra crea local-catalog e quattro
    configurazioni condivise. Non crea un resource definition group.
