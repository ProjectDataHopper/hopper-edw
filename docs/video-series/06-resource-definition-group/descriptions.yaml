summary:
  en: >
    A resource definition group is the list of models in one warehouse.
    Open retail-sources, see retail-360.hdv on the Data Vault tab, and open
    the same group on the EDW Journey.
  zh-CN: >
    resource definition group 是一个仓库里的模型清单。打开 retail-sources，在 Data Vault 页看到 retail-360.hdv，并在 EDW Journey 上打开同一个组。
  es-ES: >
    Un resource definition group es la lista de modelos de un almacén. Abre
    retail-sources, mira retail-360.hdv en la pestaña Data Vault y abre el
    mismo grupo en el EDW Journey.
  pt-PT: >
    Um resource definition group é a lista de modelos de um armazém. Abre
    retail-sources, vê retail-360.hdv no separador Data Vault e abre o mesmo
    grupo no EDW Journey.
  fr-FR: >
    Un resource definition group est la liste des modèles d'un entrepôt. Ouvre
    retail-sources, vois retail-360.hdv dans l'onglet Data Vault et ouvre le
    même groupe dans l'EDW Journey.
  de-DE: >
    Eine resource definition group ist die Liste der Modelle eines Warehouse.
    Öffne retail-sources, sieh retail-360.hdv auf dem Data Vault Reiter und
    öffne dieselbe Gruppe in der EDW Journey.
  it-IT: >
    Un resource definition group è l'elenco dei modelli di un warehouse. Apri
    retail-sources, vedi retail-360.hdv nella scheda Data Vault e apri lo
    stesso gruppo nell'EDW Journey.
