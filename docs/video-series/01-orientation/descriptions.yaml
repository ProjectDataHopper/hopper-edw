summary:
  en: >
    Data Hopper EDW is a set of Apache Hop plugins for an enterprise data
    warehouse. This short video explains the four model files, the catalog,
    the resource definition group, and where the rest of the series goes.
  zh-CN: >
    Data Hopper EDW 是一组 Apache Hop 插件，用来搭建企业数据仓库。这段短片说明四个模型文件、Data Catalog、resource definition group，以及这一系列接下来去哪里。
  es-ES: >
    Data Hopper EDW es un conjunto de plugins de Apache Hop para un almacén
    de datos empresarial. Este vídeo corto explica los cuatro archivos de
    modelo, el Data Catalog, el resource definition group y hacia dónde va
    el resto de la serie.
  pt-PT: >
    Data Hopper EDW é um conjunto de plugins do Apache Hop para um armazém
    de dados empresarial. Este vídeo curto explica os quatro ficheiros de
    modelo, o Data Catalog, o resource definition group e para onde vai o
    resto da série.
  fr-FR: >
    Data Hopper EDW est un ensemble de plugins Apache Hop pour un entrepôt
    de données d'entreprise. Cette courte vidéo explique les quatre fichiers
    de modèle, le Data Catalog, le resource definition group, et la suite
    de la série.
  de-DE: >
    Data Hopper EDW ist eine Gruppe von Apache Hop Plugins für ein Enterprise
    Data Warehouse. Dieses kurze Video erklärt die vier Modelldateien, den
    Data Catalog, die resource definition group und den weiteren Verlauf
    der Reihe.
  it-IT: >
    Data Hopper EDW è un insieme di plugin di Apache Hop per un data warehouse
    aziendale. Questo breve video spiega i quattro file di modello, il Data
    Catalog, il resource definition group e dove va il resto della serie.
