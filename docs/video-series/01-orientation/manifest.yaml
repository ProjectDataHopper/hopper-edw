# Narration for video 01. English is the source.
# Product words stay in English. See docs/video-series/glossary.yaml.
video:
  id: 01-orientation
  title: "What Data Hopper EDW is"
  issue: 225
  width: 1920
  height: 1080
  fps: 30
  transition: fade
  transition_ms: 400
  padding_after_sec: 0.4
  voice_id: ara
  locales:
    - en
    - zh-CN
    - es-ES
    - pt-PT
    - fr-FR
    - de-DE
    - it-IT
  links:
    - label: Getting started
      url: https://github.com/ProjectDataHopper/hopper-edw/blob/main/docs/getting-started-edw.adoc
    - label: Training
      url: https://github.com/ProjectDataHopper/hopper-edw/blob/main/docs/training/index.adoc
