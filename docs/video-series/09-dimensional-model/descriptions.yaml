title:
  en: Dimensional model
  zh-CN: 维度模型
  es-ES: Modelo dimensional
  pt-PT: Modelo dimensional
  fr-FR: Modèle dimensionnel
  de-DE: Dimensionales Modell
  it-IT: Modello dimensionale
summary:
  en: >
    A dimensional model is facts and dimensions for a report. Open
    retail-f-orders.hdm, see the role-playing dates, and the bus matrix
    that planned them. The semantic layer retail-f-orders.hsl is how a
    page reads the fact.
  zh-CN: >
    维度模型是报表用的事实和维度。打开 retail-f-orders.hdm，看角色扮演日期，以及规划它们的总线矩阵。语义层 retail-f-orders.hsl 是页面读取事实的方式。
  es-ES: >
    Un modelo dimensional son hechos y dimensiones para un informe. Abre
    retail-f-orders.hdm, mira las fechas con roles y la matriz bus que las
    planificó. La capa semántica retail-f-orders.hsl es cómo una página lee el hecho.
  pt-PT: >
    Um modelo dimensional são factos e dimensões para um relatório. Abre
    retail-f-orders.hdm, vê as datas com papéis e a matriz bus que as planeou.
    A camada semântica retail-f-orders.hsl é como uma página lê o facto.
  fr-FR: >
    Un modèle dimensionnel, ce sont des faits et des dimensions pour un rapport.
    Ouvre retail-f-orders.hdm, vois les dates à rôles et la matrice bus qui les
    a planifiées. La couche sémantique retail-f-orders.hsl est la façon dont une page lit le fait.
  de-DE: >
    Ein dimensionales Modell sind Fakten und Dimensionen für einen Bericht.
    Öffne retail-f-orders.hdm, sieh die Rollen-Daten und die Bus-Matrix, die sie
    geplant hat. Die semantische Schicht retail-f-orders.hsl ist, wie eine Seite den Fakt liest.
  it-IT: >
    Un modello dimensionale sono fatti e dimensioni per un report. Apri
    retail-f-orders.hdm, guarda le date con ruoli e la bus matrix che le ha
    pianificate. Lo strato semantico retail-f-orders.hsl è come una pagina legge il fatto.
