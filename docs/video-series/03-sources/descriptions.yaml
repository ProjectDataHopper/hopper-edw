title:
  en: Sources and the Data Catalog
  zh-CN: 源与 Data Catalog
  es-ES: Fuentes y el Data Catalog
  pt-PT: Origens e o Data Catalog
  fr-FR: Sources et le Data Catalog
  de-DE: Quellen und der Data Catalog
  it-IT: Sorgenti e il Data Catalog
summary:
  en: >
    A source is landing data. The rows stay where they are. The Data Catalog
    holds the feed name, the columns, and the keys. Retail feeds live under
    hop/retail-example/sources.
  zh-CN: >
    源是落地数据。行留在原地。Data Catalog 保存供给的名字、列和键。Retail 的供给在
    hop/retail-example/sources 下面。
  es-ES: >
    Una fuente son datos de aterrizaje. Las filas se quedan donde están. El
    Data Catalog guarda el nombre del feed, las columnas y las claves. Los
    feeds de retail viven bajo hop/retail-example/sources.
  pt-PT: >
    Uma origem são dados de chegada. As linhas ficam onde estão. O Data Catalog
    guarda o nome do feed, as colunas e as chaves. Os feeds retail ficam sob
    hop/retail-example/sources.
  fr-FR: >
    Une source, ce sont des données d'atterrissage. Les lignes restent où elles
    sont. Le Data Catalog garde le nom du flux, les colonnes et les clés. Les
    flux retail sont sous hop/retail-example/sources.
  de-DE: >
    Eine Quelle sind Landedaten. Die Zeilen bleiben, wo sie sind. Der Data
    Catalog hält den Feed-Namen, die Spalten und die Schlüssel. Retail-Feeds
    liegen unter hop/retail-example/sources.
  it-IT: >
    Una sorgente sono dati di atterraggio. Le righe restano dove sono. Il Data
    Catalog tiene il nome del feed, le colonne e le chiavi. I feed retail stanno
    sotto hop/retail-example/sources.
