# Sent to the TTS API as replace. The written narration and the subtitles
# stay as they are. A value in slashes is IPA. GUI is "gooey", not G-U-I.
# "live" the verb (/lɪv/, where the rows live) is not the adjective (/laɪv/,
# a live database). Only the verb phrases are listed.
pronounce:
  GUI: "/ˈɡuːi/"
  EDW: "E D W"
  JDBC: "J D B C"
  "rules live": "/ruːlz lɪv/"
  "rows live": "/roʊz lɪv/"
  "feeds live": "/fiːdz lɪv/"
  "settings live": "/ˈsɛtɪŋz lɪv/"
