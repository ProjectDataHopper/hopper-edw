# Product words stay in English in every spoken language, because the GUI
# in the picture uses these words. Gloss a word the first time, then keep it.
keep_english:
  - Pipeline
  - Workflow
  - Transform
  - Action
  - Hop GUI
  - Hop
  - Data Vault
  - Business Vault
  - resource definition group
  - Data Catalog
  - EDW Journey

# Literal replacements applied to the text before text-to-speech.
# Subtitles keep the narration as written. Longer patterns win.
speak_as:
  - pattern: "${PROJECT_HOME}"
    say: project home
  - pattern: hop/retail-example/models
    say: hop, retail example, models
  - pattern: run-retail-update-models.hwf
    say: run retail update models
