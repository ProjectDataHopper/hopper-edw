# Product words stay in English in every spoken language, because the GUI
# in the picture uses these words. Gloss a word the first time, then keep it.
keep_english:
  - Pipeline
  - Workflow
  - Transform
  - Action
  - Hop GUI
  - Hop
  - Data Vault
  - Business Vault
  - resource definition group
  - Data Catalog
  - EDW Journey

# Literal replacements applied to the text before text-to-speech.
# Subtitles keep the narration as written. Longer patterns win.
speak_as:
  - pattern: plugins/misc/hopper-edw
    say: plugins misc hopper E D W
  - pattern: 2.20.0-SNAPSHOT
    say: two twenty snapshot
  - pattern: "2.20"
    say: two twenty
  - pattern: local-catalog
    say: local catalog
  - pattern: source-model
    say: source model
  - pattern: business-vault
    say: business vault
  - pattern: data-vault
    say: data vault
  - pattern: "54320"
    say: five four three two zero
  - pattern: data-hopper.com
    say: data hopper dot com
  - pattern: retail-example
    say: retail example
  - pattern: retail-sources
    say: retail sources
  - pattern: ".hsm"
    say: dot H S M
  - pattern: ".hdv"
    say: dot H D V
  - pattern: ".hbv"
    say: dot H B V
  - pattern: ".hdm"
    say: dot H D M
  - pattern: ".hsl"
    say: dot H S L
  - pattern: ".hlv"
    say: dot H L V

# Sent to the TTS API as replace. The written narration and the subtitles
# stay as they are. A value in slashes is IPA. GUI is "gooey", not G-U-I.
pronounce:
  GUI: "/ˈɡuːi/"
  EDW: "E D W"
  JDBC: "J D B C"
