# SQL Server source for the adventureworks/ sample. Vault/OPS stay on
# compose.postgres-local.yml (test_aw_edw / test_aw_ops).
# Distinct project name so `up`/`down` does not recreate hop-data-vault-postgres-local.
name: hop-adventureworks

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: hop-adventureworks-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Test_Password123}"
      MSSQL_PID: Developer
    ports:
      - "${AW_SQL_HOST_PORT:-14333}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - hop-adventureworks-mssql-data:/var/opt/mssql

volumes:
  hop-adventureworks-mssql-data:
