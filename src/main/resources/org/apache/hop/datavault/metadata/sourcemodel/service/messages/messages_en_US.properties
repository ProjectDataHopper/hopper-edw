SourceModelService.name=Source model service
SourceModelService.description=Expose a named source model (.hsm) over Hop Server for free SQL / JDBC without publishing filesystem paths

SourceModelServiceEditor.Name.Label=Name
SourceModelServiceEditor.Enabled.Label=Enabled
SourceModelServiceEditor.Description.Label=Description
SourceModelServiceEditor.ModelFilename.Label=Source model file
SourceModelServiceEditor.ModelFilename.Tooltip=Server-side path to the .hsm file (variables allowed). Clients only see the service name.
SourceModelServiceEditor.DefaultRowLimit.Label=Default row limit
SourceModelServiceEditor.DefaultRowLimit.Tooltip=Applied when the client omits rowLimit (0 \= no default limit unless max is set)
SourceModelServiceEditor.MaxRowLimit.Label=Max row limit
SourceModelServiceEditor.MaxRowLimit.Tooltip=Hard cap per query (0 \= unlimited). Always enforced when greater than zero.
SourceModelServiceEditor.AllowSchemaMetadata.Label=Allow schema metadata
SourceModelServiceEditor.AllowSchemaMetadata.Tooltip=When checked, clients can list tables and columns via JDBC DatabaseMetaData
SourceModelServiceEditor.Help.Label=This name is the JDBC schema. Thin client URL\: jdbc\:hop-hsm\://user\:pass@host\:port  or  jdbc\:hop-hsm\://user\:pass@host\:port/<this name>
