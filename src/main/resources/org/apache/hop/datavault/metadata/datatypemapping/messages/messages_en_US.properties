DataTypeMappingMeta.name=Data type mapping
DataTypeMappingMeta.description=Project-level pre-modeling data type mapping profiles for source fields

DataTypeMappingMetaEditor.Name.Label=Name
DataTypeMappingMetaEditor.Description.Label=Description
DataTypeMappingMetaEditor.Tab.Scope.Label=Scope
DataTypeMappingMetaEditor.Tab.Rules.Label=Rules
DataTypeMappingMetaEditor.Scope.Label=Source kinds (scope)
DataTypeMappingMetaEditor.SourceKinds.ToolTip=Select zero, one, or more source kinds this profile is intended for (Ctrl/Cmd+click for multi-select).\nDATABASE, CSV, PARQUET, ICEBERG, JSON, PIPELINE, COMPOSITE.\nNo selection = any kind when the profile is attached. Scope is advisory (suggest / warn); explicit attach still applies the profile.
DataTypeMappingMetaEditor.DatabasePattern.Label=Database name pattern
DataTypeMappingMetaEditor.SchemaPattern.Label=Schema name pattern
DataTypeMappingMetaEditor.PathPattern.Label=Path / topic pattern
DataTypeMappingMetaEditor.CatalogNamespacePattern.Label=Catalog namespace pattern
DataTypeMappingMetaEditor.Pattern.ToolTip=One pattern per field (not a comma-separated list). Empty = match all.\n\u2022 Exact: CRM (case-insensitive)\n\u2022 Glob: CRM*, *landing*, file_?.csv  (* = any chars, ? = one char)\n\u2022 Regex: starts with ^ or contains ( or [  e.g. ^crm_.*\nHop variables allowed, e.g. '${PROJECT_NAME}'*
DataTypeMappingMetaEditor.RulePattern.ToolTip=Pattern against source SQL type or field name. Same syntax as scope patterns: empty=all, exact, glob (* ?), or regex (^ [ ().
DataTypeMappingMetaEditor.Rules.Label=Rules (first match wins within this profile; attach multiple profiles for attribute-level layering)
DataTypeMappingMetaEditor.Rules.ToolTip=Ordered rules. First matching rule in this profile applies to a field. Use Help for column descriptions.

DataTypeMapping.Check.ProfileMissingName=Data type mapping profile has no name
DataTypeMapping.Check.ProfileNoRules=Data type mapping profile ''{0}'' has no rules
DataTypeMapping.Check.RuleNoMatchCriteria=Data type mapping ''{0}'' rule ''{1}'' has no match criteria
DataTypeMapping.Check.RuleNoTarget=Data type mapping ''{0}'' rule ''{1}'' has no target attributes
DataTypeMapping.Check.RuleInvalidTargetType=Data type mapping ''{0}'' rule ''{1}'' has invalid target hop type {2}
DataTypeMapping.Check.RuleUnknownMatchHopType=Data type mapping ''{0}'' rule ''{1}'' match hop type ''{2}'' is not a known Hop type name
DataTypeMapping.Check.OverrideUnknownField=Source ''{0}'': field override references unknown source field ''{1}''
DataTypeMapping.Check.DuplicateTargetName=Source ''{0}'': multiple fields map to target name ''{1}''
DataTypeMapping.Check.StringToTemporalWithoutMask=Source ''{0}'' field ''{1}'': String to {2} without a conversion mask is unsafe
DataTypeMapping.Check.StringToTemporalMissingLocaleTz=Source ''{0}'' field ''{1}'': String to Date/Timestamp should set locale and/or time zone
DataTypeMapping.Check.StringToNumericWithoutMask=Source ''{0}'' field ''{1}'': String to {2} without conversion mask or lenient flag may fail at runtime
DataTypeMapping.Check.StringToNumberMissingSymbols=Source ''{0}'' field ''{1}'': String to Number should set decimal and/or grouping symbols
DataTypeMapping.Check.BooleanishConversion=Source ''{0}'' field ''{1}'': conversion {2} \u2192 {3} may need an explicit convention (0/1, Y/N)
DataTypeMapping.Check.PkTypeChange=Source ''{0}'' field ''{1}'': primary key type change may break joins or hash keys
DataTypeMapping.Check.LengthNarrowing=Source ''{0}'' field ''{1}'': length narrowed from {2} to {3} (truncation risk)
