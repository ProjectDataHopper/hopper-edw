TargetTypeMappingMeta.name=Target type mapping
TargetTypeMappingMeta.description=Project-level Hop type to native SQL type preferences for generated DDL

TargetTypeMappingMetaEditor.Name.Label=Name
TargetTypeMappingMetaEditor.Description.Label=Description
TargetTypeMappingMetaEditor.TargetDatabase.Label=Target database
TargetTypeMappingMetaEditor.TargetDatabase.ToolTip=Optional Hop database connection this mapping is intended for. When exactly one mapping names a connection, DDL for that connection uses it automatically.
TargetTypeMappingMetaEditor.Tab.Rules.Label=Rules
TargetTypeMappingMetaEditor.Tab.Preview.Label=Preview
TargetTypeMappingMetaEditor.Rules.Label=Rules (first match wins; put more specific rules first)
TargetTypeMappingMetaEditor.Rules.ToolTip=Ordered rules. First matching enabled rule supplies the native SQL type. Unmatched columns keep the Hop dialect default.
TargetTypeMappingMetaEditor.RulePattern.ToolTip=Pattern against the field name. Empty\=all. Exact, glob (* ?), or regex (^ [ ().
TargetTypeMappingMetaEditor.TargetSqlType.ToolTip=Native SQL type template. Hop variables like '${VARCHAR_TYPE}' are resolved first, then '{length}' and '{precision}' from the Hop field.
TargetTypeMappingMetaEditor.Preview.HopType.Label=Hop type
TargetTypeMappingMetaEditor.Preview.Length.Label=Length
TargetTypeMappingMetaEditor.Preview.Precision.Label=Precision
TargetTypeMappingMetaEditor.Preview.FieldName.Label=Field name
TargetTypeMappingMetaEditor.Preview.Result.Label=Resolved SQL type
TargetTypeMappingMetaEditor.Preview.NoMatch=dialect default (no rule matched)

TargetTypeMapping.Error.MappingNotFound=Target type mapping ''{0}'' was not found.

TargetTypeMapping.Check.ProfileMissingName=Target type mapping has no name
TargetTypeMapping.Check.ProfileNoRules=Target type mapping ''{0}'' has no rules
TargetTypeMapping.Check.NoTargetDatabase=Target type mapping ''{0}'' has no target database (auto-match will not pick it)
TargetTypeMapping.Check.RuleNoMatchCriteria=Target type mapping ''{0}'' rule ''{1}'' has no match criteria
TargetTypeMapping.Check.RuleNoTargetSql=Target type mapping ''{0}'' rule ''{1}'' has no target SQL type
TargetTypeMapping.Check.RuleUnknownMatchHopType=Target type mapping ''{0}'' rule ''{1}'' match hop type ''{2}'' is not a known Hop type name
TargetTypeMapping.Check.MinGreaterThanMax=Target type mapping ''{0}'' rule ''{1}'' has min {2} greater than max {3}
TargetTypeMapping.Check.LengthAbsentWithLengthPlaceholder=Target type mapping ''{0}'' rule ''{1}'' matches length-absent fields but the target SQL uses '{length}' (the rule can never apply)
TargetTypeMapping.Check.BroadRule=Target type mapping ''{0}'' rule ''{1}'' matches a Hop type with no length, precision, or field-name filter
TargetTypeMapping.Check.DuplicateTargetDatabase=More than one target type mapping names database ''{0}'' ({1}). Auto-match is skipped; select a mapping explicitly.
