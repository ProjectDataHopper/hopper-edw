SourceRelationshipProfileStrategy.ExactKey=Exact key analytics (recommended for small tables)
SourceRelationshipProfileStrategy.SampledKey=Sampled key analytics (large tables)
SourceRelationshipProfileStrategy.StatsOnly=Statistics-only heuristic (very large tables)
SourceRelationshipProfileStrategy.FullOuter=Full outer join probe (tiny tables only)

SourceRelationshipProfiler.Error.InvalidRelationship=Relationship is incomplete (tables and join columns required)
SourceRelationshipProfiler.Error.MissingTables=Child or parent table was not found on the source model
SourceRelationshipProfiler.Error.NotDatabase=Profiling requires both tables to be database sources on the same connection
SourceRelationshipProfiler.Error.DifferentConnections=Child and parent tables must use the same database connection for profiling
SourceRelationshipProfiler.Error.ConnectionNotFound=Database connection ''{0}'' was not found
SourceRelationshipProfiler.Error.ProfileFailed=Error while profiling the relationship

SourceRelationshipProfiler.Recommend.EXACT_KEY=Recommended strategy\: exact key analytics (child ~{0} rows, parent ~{1} rows)
SourceRelationshipProfiler.Recommend.SAMPLED_KEY=Recommended strategy\: sampled key analytics (child ~{0} rows, parent ~{1} rows). Full joins are avoided.
SourceRelationshipProfiler.Recommend.STATS_ONLY=Recommended strategy\: statistics-only heuristic (child ~{0} rows, parent ~{1} rows). Tables are too large for join-based profiling.
SourceRelationshipProfiler.Recommend.FULL_OUTER=Recommended strategy\: full outer join probe (child ~{0} rows, parent ~{1} rows)

SourceRelationshipProfiler.Warn.FullOuterTooLarge=Full outer join was requested but tables exceed the safe size limit ({0} rows). Using a safer strategy.
SourceRelationshipProfiler.Warn.DowngradeToSample=Tables exceed the exact-analytics size limit\; using sampled key analytics instead.
SourceRelationshipProfiler.Warn.DowngradeToStats=Tables exceed the sampling size limit\; using statistics-only heuristic instead.
SourceRelationshipProfiler.Sampled.Note=Key analytics ran on samples of up to {0} rows per table.
SourceRelationshipProfiler.StatsOnly.Note=No join queries were executed. Multiplicity is a low-confidence heuristic from sizes and keys.
