DataVaultConfigOptionPlugin.DrawHashKeysInModel.Message = Draw hash keys in model
DataVaultConfigOptionPlugin.EnforceTargetUnicodeCapability.Message = Enforce Unicode-capable target databases (EDW)
DataVaultConfigOptionPlugin.EnforceTargetUnicodeCapability.ToolTip = When enabled (default), model check fails if the vault/target database is not Unicode-capable for full string storage (for example MySQL/SingleStore without utf8mb4, SQL Server without a _UTF8 collation, PostgreSQL without UTF8). Disable only for controlled migrations onto legacy charsets such as MySQL utf8 (utf8mb3); failures then become warnings.
DataVaultConfigOptionPlugin.WarnTimestampFractionalPrecisionLoss.Message = Warn when timestamp fractional precision is reduced
DataVaultConfigOptionPlugin.WarnTimestampFractionalPrecisionLoss.ToolTip = When enabled (default), model check warns if a source date/time has more fractional-second digits than the target layout or engine allows (for example nanosecond timestamps stored as SingleStore/MySQL DATETIME(6) microseconds). Disable when truncation is accepted.
DataVaultConfigOptionPlugin.MaxUndoOperations.Message = Maximum undo/redo operations kept in memory
DataVaultConfigOptionPlugin.DmDefaultSurrogateKeyField.Message = Default surrogate key field
DataVaultConfigOptionPlugin.DmDefaultVersionField.Message = Default version field
DataVaultConfigOptionPlugin.DmDefaultEffectiveFromField.Message = Default effective from field
DataVaultConfigOptionPlugin.DmDefaultEffectiveToField.Message = Default effective to field
DataVaultConfigOptionPlugin.DmDefaultLoadTimestampField.Message = Default load timestamp field
DataVaultConfigOptionPlugin.DmDefaultCurrentFlagField.Message = Default current flag field
DataVaultConfigOptionPlugin.DefaultPipelineRunConfiguration.Message = Default pipeline run configuration
DataVaultConfigOptionPlugin.DefaultWorkflowRunConfiguration.Message = Default workflow run configuration
DataVaultConfigOptionPlugin.LiveUpdatePollIntervalSeconds.Message = Live model update refresh interval (seconds)
DataVaultConfigOptionPlugin.LiveUpdatePollIntervalSeconds.ToolTip = How often Hop polls running model updates for live metrics in the workflow action badge and Live model update dialog. Default 10 if empty.
DataVaultConfigOptionPlugin.SchemaRemediationFolder.Message = Schema remediation folder
DataVaultConfigOptionPlugin.SchemaRemediationFolder.ToolTip = Root folder where named schema-remediation packages are written (workflow, SQL, HTML/Markdown report). Default '${PROJECT_HOME}'/workflows/schema-remediation. Each apply creates a sub-folder named by the DV admin.
DataVaultConfigOptionPlugin.ModelGraphSplineSegments.Message = Relationship spline segments in model graphs

