ActionImportDbtProject.Name=Import dbt project
ActionImportDbtProject.Description=Scan a dbt-core project and import SQL models into Business Vault (.hbv) files and a Jinja macro library
ActionImportDbtProject.Keywords=dbt jinja import business vault macros
ActionImportDbtProject.Title=Import dbt project
ActionImportDbtProject.ProjectFolder.Label=dbt project folder
ActionImportDbtProject.ProjectFolder.ToolTip=Folder that contains dbt_project.yml (or a child folder)
ActionImportDbtProject.TargetHbv.Label=Target .hbv file
ActionImportDbtProject.TargetHbv.ToolTip=Business Vault model to update (CURRENT_MODEL) or create (NEW_MODEL). Unused for SPLIT_BY_FOLDER.
ActionImportDbtProject.Destination.Label=Destination
ActionImportDbtProject.Destination.ToolTip=CURRENT_MODEL updates the target .hbv; NEW_MODEL writes that path; SPLIT_BY_FOLDER writes one .hbv per first-level models/ folder
ActionImportDbtProject.OutputFolder.Label=Output folder
ActionImportDbtProject.OutputFolder.ToolTip=Required for SPLIT_BY_FOLDER. Optional output directory for NEW_MODEL when the target is a basename only.
ActionImportDbtProject.Conflict.Label=If table exists
ActionImportDbtProject.Conflict.ToolTip=SKIP leaves existing SQL tables; REPLACE overwrites matching BvBusinessTable cards
ActionImportDbtProject.ImportMacros.Label=Import macros
ActionImportDbtProject.ImportMacros.ToolTip=Create or replace a Jinja Macro Library from macros/*.sql and dbt vars
ActionImportDbtProject.LibraryName.Label=Macro library name
ActionImportDbtProject.LibraryName.ToolTip=Hop metadata name. Empty uses '{project}-macros'
ActionImportDbtProject.Error.MissingProject=dbt project folder is required
ActionImportDbtProject.Error.MissingTargetHbv=Target .hbv file is required for CURRENT_MODEL and NEW_MODEL
ActionImportDbtProject.Error.MissingOutputFolder=Output folder is required for SPLIT_BY_FOLDER
ActionImportDbtProject.Error.ScanFailed=Could not scan dbt project: {0}
ActionImportDbtProject.Error.ImportFailed=dbt import failed: {0}
