ActionExportArchitecture.Name=Export architecture
ActionExportArchitecture.Title=Export architecture \: {0}
ActionExportArchitecture.Description=Export Draw.io diagrams\: solution architecture, data inventory, aggregated layer models, and/or per-model diagrams (ELK)
ActionExportArchitecture.Keywords=architecture,drawio,archimate,export,diagram,enterprise,model,elk,resource definition group
ActionExportArchitecture.Root.Label=Root workflow / .hem / model path(s)
ActionExportArchitecture.Root.ToolTip=Workflow or .hem for SOLUTION. For DATA / MODEL / MODELS\: comma-separated .hdv/.hbv/.hdm paths when no resource definition group is set. Optional when a group supplies models.
ActionExportArchitecture.ResourceDefinitionGroup.Label=Resource definition group
ActionExportArchitecture.ResourceDefinitionGroup.ToolTip=Optional. When set, supplies model files for DATA, MODEL, MODELS, and SOLUTION "also export" options (overrides root path list and execution-map discovery).
ActionExportArchitecture.ViewType.Label=View type
ActionExportArchitecture.ViewType.ToolTip=SOLUTION\=process architecture\; DATA\=table inventory (no ER edges)\; MODEL\=aggregated data-vault / business-vault / dimensional Draw.io (ELK)\; MODELS\=one Draw.io per model under type subfolders\; END_TO_END uses SOLUTION layout
ActionExportArchitecture.OutputFile.Label=Output Draw.io file
ActionExportArchitecture.OutputFile.ToolTip=Path for the primary .drawio file (variables supported). Empty uses a default under the project.
ActionExportArchitecture.AlsoExportData.Label=Also export DATA inventory from discovered models
ActionExportArchitecture.AlsoExportData.ToolTip=When view is SOLUTION, also export a table/source inventory Draw.io (no relationship edges). Prefers the resource definition group when set.
ActionExportArchitecture.DataOutputFile.Label=DATA inventory output Draw.io file
ActionExportArchitecture.DataOutputFile.ToolTip=Optional path for the inventory diagram when Also export DATA is enabled
ActionExportArchitecture.AlsoExportModels.Label=Also export aggregated model diagrams (ELK)
ActionExportArchitecture.AlsoExportModels.ToolTip=Write data-vault.drawio, business-vault.drawio, and dimensional.drawio from models on the map or resource definition group (tables unioned across files, ELK layout)
ActionExportArchitecture.ModelsOutputFolder.Label=Models output folder
ActionExportArchitecture.ModelsOutputFolder.ToolTip=Folder for MODEL aggregates and MODELS per-file diagrams (default '${PROJECT_HOME}'/work/architecture/models). MODELS writes data-vault/, business-vault/, and dimensional/ subfolders.
ActionExportArchitecture.Error.MissingRoot=Please specify a root workflow or .hem file
ActionExportArchitecture.Error.MissingModels=Please specify a resource definition group or model path(s) for DATA / MODEL / MODELS export
ActionExportArchitecture.Error.Failed=Architecture export failed
ActionExportArchitecture.Log.WroteSolution=Wrote SOLUTION architecture to {0} ({1} nodes, {2} edges)
ActionExportArchitecture.Log.WroteData=Wrote DATA inventory to {0} ({1} nodes, {2} edges)
ActionExportArchitecture.Log.WroteModel=Wrote aggregated MODEL diagram to {0} ({1} nodes, {2} edges)
ActionExportArchitecture.Log.WrotePerModel=Wrote per-model diagram to {0} ({1} nodes, {2} edges)
ActionExportArchitecture.Log.NoModelsForData=No model files discovered on the execution map or resource definition group\; skipped
