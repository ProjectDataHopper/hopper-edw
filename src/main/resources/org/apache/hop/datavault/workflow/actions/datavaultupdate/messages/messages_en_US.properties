#
# Data Vault Update Workflow Action
#

ActionDataVaultUpdate.Name=Data Vault Update
ActionDataVaultUpdate.Description=Updates a Data Vault by generating and executing update pipelines for all tables in a Data Vault model.
ActionDataVaultUpdate.Keywords=data vault,update,dv,datavault
ActionDataVaultUpdate.Title=Data Vault Update
ActionDataVaultUpdate.Name.Label=Action name
ActionDataVaultUpdate.Tab.Model.Label=Model
ActionDataVaultUpdate.Tab.Model.ToolTip=Data Vault model file, pipeline run configuration, and model validation options
ActionDataVaultUpdate.Tab.Ddl.Label=DDL
ActionDataVaultUpdate.Tab.Ddl.ToolTip=Target database structure creation, DDL file output, and DDL guard options
ActionDataVaultUpdate.Tab.Source.Label=Source
ActionDataVaultUpdate.Tab.Source.ToolTip=Record source filtering and data load options
ActionDataVaultUpdate.DataVaultModel.Label=Data Vault Model file
ActionDataVaultUpdate.DataVaultModel.ToolTip=The .hdv file containing the Data Vault model (.hdv) to update.
ActionDataVaultUpdate.PipelineRunConfiguration.Label=Pipeline run configuration
ActionDataVaultUpdate.PipelineRunConfiguration.ToolTip=The pipeline run configuration used when executing generated update pipelines. When empty, uses the global default from Configuration > Data Vault 2.0, then local.
ActionDataVaultUpdate.WorkflowRunConfiguration.Label=Workflow run configuration
ActionDataVaultUpdate.WorkflowRunConfiguration.ToolTip=The workflow run configuration used when executing the generated bulk-load master workflow in Staging file mode. When empty, uses the global default from Configuration > Data Vault 2.0, then local.
ActionDataVaultUpdate.ParallelPipelineCopies.Label=Parallel pipeline copies
ActionDataVaultUpdate.ParallelPipelineCopies.ToolTip=Number of Pipeline Executor copies used to run staged update pipelines in parallel (round-robin distribution). Default is 1.
ActionDataVaultUpdate.PipelineStagingFolder.Label=Pipeline staging folder
ActionDataVaultUpdate.PipelineStagingFolder.ToolTip=Folder where generated update pipelines are staged before execution. When empty, defaults to '${java.io.tmpdir}/dv2/<model-name>/'.
ActionDataVaultUpdate.PublishToCatalog.Label=Update data catalog
ActionDataVaultUpdate.PublishToCatalog.ToolTip=Upsert record definitions for each DV target table (column layout, origin, physical table reference) into the configured data catalog. DV source record definitions remain in the source catalog (local-catalog). Runs even when the target database data update is skipped.
ActionDataVaultUpdate.DataCatalogConnection.Label=Data catalog connection
ActionDataVaultUpdate.DataCatalogConnection.ToolTip=The data catalog metadata connection to publish record definitions to (requires Publish to data catalog).
ActionDataVaultUpdate.Error.NoDataCatalogConnection=Publish to data catalog is enabled but no data catalog connection was specified.
ActionDataVaultUpdate.Error.CatalogPublishFailed=Failed to publish record definitions to the data catalog.
ActionDataVaultUpdate.Log.CatalogPublished=Published {0} DV table record definitions to data catalog ''{1}'' ({2} errors).
ActionDataVaultUpdate.ExecutionMetricsProfile.Label=Execution metrics profile
ActionDataVaultUpdate.ExecutionMetricsProfile.ToolTip=Reusable profile for load-run metrics collection, catalog publishing, and tuning insights
ActionDataVaultUpdate.MetricsOutputFolder.Label=Metrics output folder
ActionDataVaultUpdate.MetricsOutputFolder.ToolTip=Optional folder where update metrics are written as JSON after the orchestrator pipeline finishes. The filename is built from the model name and the orchestrator log channel id. When empty, metrics are only logged.
ActionDataVaultUpdate.Error.NoModelFile=No Data Vault Model file was specified.
ActionDataVaultUpdate.Error.NoRunConfig=No Pipeline Run Configuration was specified.
ActionDataVaultUpdate.Log.NoTables=No tables defined in the Data Vault model.
ActionDataVaultUpdate.Log.GeneratingForTable=Generating update pipeline for table: {0}
ActionDataVaultUpdate.Log.LoadingCustomPipelines=Loading custom update pipeline(s) for table: {0}
ActionDataVaultUpdate.Log.SkippingExternalTable=Skipping external read-only table (no update pipeline): {0}
ActionDataVaultUpdate.Log.SkippingLinkedTable=Skipping linked table (no update pipeline): {0}
ActionDataVaultUpdate.Log.SkippingSpecialRecordsExternal=Skipping sentinel rows for external read-only table: {0}
ActionDataVaultUpdate.Error.CustomPipelinesMissing=Custom pipelines mode is enabled for table {0} but no valid .hpl files were loaded
ActionDataVaultUpdate.Error.GenerateFailed=Failed to generate pipeline for table: {0}
ActionDataVaultUpdate.Error.GenerateFailedEmpty=No update pipeline was returned for table ''{0}''.
ActionDataVaultUpdate.Log.RunningPipeline=Running update pipeline for table: {0} using run configuration: {1}
ActionDataVaultUpdate.Log.StagingPipelines=Staging {1} generated update pipeline(s) to {0}
ActionDataVaultUpdate.Log.ParallelCopies=Running staged pipelines with {0} parallel Pipeline Executor copy/copies
ActionDataVaultUpdate.Log.MultiSourceSerialWorkflow=Table ''{0}'' has multiple sources; running {1} source pipeline(s) in series via a multi-source update workflow
ActionDataVaultUpdate.Log.RunningMultiSourceWorkflow=Running multi-source update workflow for table ''{0}'': {1} ({2} source pipeline(s) in series)
ActionDataVaultUpdate.Log.RunningMultiSourceStaging=Running multi-source staging bulk load for table ''{0}'' with {1} source pipeline(s) in series
ActionDataVaultUpdate.Log.SavedGeneratedWorkflow=Saved generated multi-source workflow ''{0}'' to {1}
ActionDataVaultUpdate.Error.MultiSourceWorkflowFailed=Multi-source update workflow ''{0}'' for table ''{1}'' failed
ActionDataVaultUpdate.Log.RunningOrchestrator=Running orchestrator pipeline ''{0}'' using run configuration: {1}
ActionDataVaultUpdate.Log.StagingCleanup=Removed pipeline staging folder {0}
ActionDataVaultUpdate.Error.OrchestratorFailed=One or more staged update pipelines completed with errors.
ActionDataVaultUpdate.Error.StagingCleanupFailed=Failed to remove pipeline staging folder {0}
ActionDataVaultUpdate.Log.StagingBulkDataFolder=Bulk-load staging folder: {0}
ActionDataVaultUpdate.Log.RunningBulkWorkflow=Running bulk-load workflow ''{0}'' for {1} staged pipeline(s)
ActionDataVaultUpdate.Log.SavedGeneratedWorkflow=Saved generated workflow ''{0}'' to {1}
ActionDataVaultUpdate.Log.BulkStagingCleanup=Removed bulk-load staging folder {0}
ActionDataVaultUpdate.Error.BulkWorkflowFailed=One or more bulk-load workflow actions completed with errors.
ActionDataVaultUpdate.Error.BulkStagingCleanupFailed=Failed to remove bulk-load staging folder {0}
ActionDataVaultUpdate.Error.NoTargetDatabase=Target database is not configured for staging-file bulk loading.
ActionDataVaultUpdate.Log.SavedGeneratedPipeline=Saved generated pipeline ''{0}'' to {1}
ActionDataVaultUpdate.Error.PipelineFailed=Pipeline for table {0} completed with errors.
ActionDataVaultUpdate.Error.General=Error while updating Data Vault
ActionDataVaultUpdate.LogModelCheckFailures.Label=Log model check failures
ActionDataVaultUpdate.LogModelCheckFailures.ToolTip=When enabled, DataVaultModel.check() is called and any non-OK check results are logged using logBasic().
ActionDataVaultUpdate.AbortOnModelCheckFailures.Label=Abort on model check failures
ActionDataVaultUpdate.AbortOnModelCheckFailures.ToolTip=When enabled, the model is checked first. Failures are logged and the action aborts immediately without running any update pipelines.
ActionDataVaultUpdate.DetailedDataTypeChecking.Label=Detailed data type checking
ActionDataVaultUpdate.DetailedDataTypeChecking.ToolTip=When enabled (default), model check validates source-to-target field type compatibility using live source schema where supported (e.g. database tables). Disable to validate using stored source field metadata only.
ActionDataVaultUpdate.Log.ModelCheckResult=Model check: {0} - {1}
ActionDataVaultUpdate.Log.AbortingOnModelCheck=Aborting due to model check failures. No update pipelines were executed.
ActionDataVaultUpdate.ReferencedObject.Description=Open the referenced data vault model
ActionDataVaultUpdate.UpdateTargetStructure.Label=Update target database structure
ActionDataVaultUpdate.UpdateTargetStructure.ToolTip=When enabled (default), the action will generate and execute CREATE/ALTER DDL on the target database(s) before running data load pipelines. Disable if you manage target schemas outside of this action (e.g. via migrations or pre-provisioned tables).
ActionDataVaultUpdate.DdlSqlFilename.Label=DDL SQL filename
ActionDataVaultUpdate.DdlSqlFilename.ToolTip=Optional path to a SQL file where generated DDL is written when schema changes are needed. DDL can be stored here without executing it on the target database.
ActionDataVaultUpdate.FailIfDdlNeeded.Label=Fail if DDL is needed
ActionDataVaultUpdate.FailIfDdlNeeded.ToolTip=When enabled, the action fails immediately if any DDL would be required to update the target database structure. Use this to ensure schemas are already up to date before loading data.
ActionDataVaultUpdate.DoNotUpdateTargetDatabase.Label=Do not update target database
ActionDataVaultUpdate.DoNotUpdateTargetDatabase.ToolTip=When enabled, the action skips running the generated data load pipelines. DDL generation, storage, and execution (if configured) still run.
ActionDataVaultUpdate.LoadDate.Label=Load date
ActionDataVaultUpdate.LoadDate.ToolTip=Optional fixed load date for this batch update (format yyyy/MM/dd HH:mm:ss.SSS). When empty, the current date and time is used. Supports variables.
ActionDataVaultUpdate.Log.UsingLoadDate=Using configured load date: {0}
ActionDataVaultUpdate.Log.UsingCurrentLoadDate=Using current date and time as load date
ActionDataVaultUpdate.Log.UsingLoadCycleId=Using load cycle ID: {0}
ActionDataVaultUpdate.Error.LoadCycleTargetMissing=Cannot allocate a load cycle ID because the model target database is not set or could not be loaded.
ActionDataVaultUpdate.Error.InvalidLoadDate=Invalid load date ''{0}''. Expected format yyyy/MM/dd HH:mm:ss.SSS.
ActionDataVaultUpdate.RecordSourceGroup.Label=Record source group
ActionDataVaultUpdate.RecordSourceGroup.ToolTip=Optional group name to limit the update to record sources tagged with the same group in their Data Vault Source metadata (e.g. hourly, daily). Leave empty to process all record sources.
ActionDataVaultUpdate.EnsureSpecialRecords.Label=Ensure unknown and invalid records
ActionDataVaultUpdate.EnsureSpecialRecords.ToolTip=When enabled, checks each hub and link in the model for unknown and invalid sentinel rows (per Data Vault Configuration) and inserts any missing rows before running load pipelines.
ActionDataVaultUpdate.Log.SpecialRecordsInserted=Inserted {1} special record(s) for table {0}
ActionDataVaultUpdate.Log.SpecialRecordsTotal=Inserted {0} special record(s) in total
ActionDataVaultUpdate.Error.SpecialRecordsFailed=Failed to ensure special records for table: {0}
ActionDataVaultUpdate.Log.UsingRecordSourceGroup=Updating record sources in group: {0}
ActionDataVaultUpdate.Log.SkippingTableForGroup=Skipping table {0}: no record sources in group {1}
ActionDataVaultUpdate.Log.SkippingDdlExecution=Skipping DDL execution on target database(s) (execution option is disabled).
ActionDataVaultUpdate.Log.NoDdlNeeded=No DDL is required for the current model.
ActionDataVaultUpdate.Log.DdlSavedToFile=DDL written to file: {0}
ActionDataVaultUpdate.Log.AbortingOnDdlNeeded=Aborting because DDL is required to update the target database structure.
ActionDataVaultUpdate.Log.LineageExplainFailed=Failed to build source-to-target lineage explanation for required DDL changes.
ActionDataVaultUpdate.Log.AbortingOnDdlFailure=Aborting because DDL generation or execution failed. Fix the target database structure before loading data.
ActionDataVaultUpdate.Log.SkippingDataUpdate=Skipping data load pipelines (do not update target database option is enabled).
ActionDataVaultUpdate.Log.ExecutingDdl=Executing DDL on target database: {0}
ActionDataVaultUpdate.Log.SkippingCreateTable=Skipping CREATE TABLE for {0} because the table already exists
ActionDataVaultUpdate.Error.DdlGenerateFailed=Failed to generate DDL for table: {0}
ActionDataVaultUpdate.Error.DdlExecutionFailed=Failed to execute DDL on target database: {0}
ActionDataVaultUpdate.Error.DdlSaveFailed=Failed to write DDL to file: {0}