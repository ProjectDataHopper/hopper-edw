ActionExportDataLineage.Name=Export data lineage
ActionExportDataLineage.Description=Export model-derived OpenLineage events (table and column lineage) to a folder and/or HTTP endpoint
ActionExportDataLineage.Keywords=openlineage lineage marquez collibra export vault
ActionExportDataLineage.Title=Export data lineage\: {0}
ActionExportDataLineage.Group.Label=Resource definition group
ActionExportDataLineage.Group.ToolTip=Exports lineage for all Data Vault, Business Vault, and dimensional models in this group
ActionExportDataLineage.IncludeDv.Label=Include Data Vault models
ActionExportDataLineage.IncludeDv.ToolTip=Emit OpenLineage events for .hdv hubs, links, and satellites
ActionExportDataLineage.IncludeBv.Label=Include Business Vault models
ActionExportDataLineage.IncludeBv.ToolTip=Emit OpenLineage events for .hbv SCD2, PIT, and other BV tables
ActionExportDataLineage.IncludeDm.Label=Include dimensional models
ActionExportDataLineage.IncludeDm.ToolTip=Emit OpenLineage events for .hdm dimensions and facts
ActionExportDataLineage.IncludeColumnLineage.Label=Include column-level lineage
ActionExportDataLineage.IncludeColumnLineage.ToolTip=Add schema and columnLineage dataset facets on each output table
ActionExportDataLineage.IncludeOperationalMetrics.Label=Include operational load metrics
ActionExportDataLineage.IncludeOperationalMetrics.ToolTip=When available, attach last-load timestamps and run ids from load_pipeline_metric
ActionExportDataLineage.OpsDatabase.Label=Ops metrics database
ActionExportDataLineage.OpsDatabase.ToolTip=Hop database connection that holds load_run / load_pipeline_metric tables
ActionExportDataLineage.OpsSchema.Label=Ops schema
ActionExportDataLineage.OpsSchema.ToolTip=Optional schema for metrics tables (for example dv_ops). Leave blank for the connection default.
ActionExportDataLineage.DestinationMode.Label=Destination
ActionExportDataLineage.DestinationMode.ToolTip=Write JSON files, POST to an OpenLineage HTTP endpoint, or both
ActionExportDataLineage.OutputFolder.Label=Output folder
ActionExportDataLineage.OutputFolder.ToolTip=Directory for one RunEvent JSON file per target table plus export-summary.json
ActionExportDataLineage.HttpUrl.Label=OpenLineage HTTP URL
ActionExportDataLineage.HttpUrl.ToolTip=For example http\://localhost\:5000/api/v1/lineage (Marquez). One RunEvent is POSTed per request.
ActionExportDataLineage.HttpApiKeyHeader.Label=HTTP API key header
ActionExportDataLineage.HttpApiKeyHeader.ToolTip=Optional header name for authentication (for example Authorization). When empty and an API key is set, Authorization is used.
ActionExportDataLineage.HttpApiKey.Label=HTTP API key
ActionExportDataLineage.HttpApiKey.ToolTip=Optional API key or bearer token value
ActionExportDataLineage.JobNamespace.Label=Job namespace
ActionExportDataLineage.JobNamespace.ToolTip=OpenLineage job namespace. Defaults to hop-data-vault with the project key appended when available.
ActionExportDataLineage.DatasetNamespace.Label=Dataset namespace
ActionExportDataLineage.DatasetNamespace.ToolTip=Optional OpenLineage dataset namespace for all inputs and outputs. When empty, namespaces are derived from Hop connection names (e.g. Vault), catalog sources, or staging labels.
ActionExportDataLineage.FailOnHttpError.Label=Fail on HTTP error
ActionExportDataLineage.FailOnHttpError.ToolTip=When enabled, a failed POST marks the action as failed
ActionExportDataLineage.TimeoutMs.Label=HTTP timeout (ms)
ActionExportDataLineage.TimeoutMs.ToolTip=Connect and request timeout in milliseconds (default 30000)
ActionExportDataLineage.Error.MissingGroup=Resource definition group is required
ActionExportDataLineage.Error.MissingOutputFolder=Output folder is required for FILE destinations
ActionExportDataLineage.Error.MissingHttpUrl=HTTP URL is required for HTTP destinations
ActionExportDataLineage.Log.Exporting=Exporting OpenLineage for resource group {0} (destination {1})
ActionExportDataLineage.Log.Warning=Warning\: {0}
ActionExportDataLineage.Log.InvalidTimeout=Invalid timeout ''{0}'', using {1}
ActionExportDataLineage.Result.Success=OpenLineage export complete\: {0} event(s), {1} file(s), {2} HTTP post(s)
ActionExportDataLineage.Result.Failed=OpenLineage export failed\: {0} event(s), {1} HTTP failure(s)
