ActionUpdateResourceDefinitionGroup.Tab.Reports.ToolTip=Markdown/HTML load overview reports

ActionUpdateResourceDefinitionGroup.Group.Label=Resource definition group
ActionUpdateResourceDefinitionGroup.Group.ToolTip=Metadata group that lists the .hdv / .hbv / .hdm models to update
ActionUpdateResourceDefinitionGroup.IncludeDataVault.Label=Include Data Vault models
ActionUpdateResourceDefinitionGroup.IncludeDataVault.ToolTip=Run Data Vault Update for each .hdv path on the group (first)
ActionUpdateResourceDefinitionGroup.IncludeBusinessVault.Label=Include Business Vault models
ActionUpdateResourceDefinitionGroup.IncludeBusinessVault.ToolTip=Run Business Vault Update for each .hbv path on the group (after DV)
ActionUpdateResourceDefinitionGroup.IncludeDimensional.Label=Include dimensional models
ActionUpdateResourceDefinitionGroup.IncludeDimensional.ToolTip=Run Dimensional Update for each .hdm path on the group (after BV)
ActionUpdateResourceDefinitionGroup.LoadDate.Label=Load date
ActionUpdateResourceDefinitionGroup.LoadDate.ToolTip=Passed to Data Vault Update (example\: '${DV_LOAD_DATE}' or '${DV_ACTUAL_LOAD_DATE}')
ActionUpdateResourceDefinitionGroup.PipelineRunConfiguration.Label=Pipeline run configuration
ActionUpdateResourceDefinitionGroup.PipelineRunConfiguration.ToolTip=Run configuration for generated load pipelines
ActionUpdateResourceDefinitionGroup.WorkflowRunConfiguration.Label=Workflow run configuration
ActionUpdateResourceDefinitionGroup.WorkflowRunConfiguration.ToolTip=Run configuration for generated bulk/staging workflows
ActionUpdateResourceDefinitionGroup.ParallelPipelineCopies.Label=Parallel pipeline copies
ActionUpdateResourceDefinitionGroup.ParallelPipelineCopies.ToolTip=Default copies for generated pipelines (variable allowed)
ActionUpdateResourceDefinitionGroup.LogModelCheckFailures.Label=Log model check failures
ActionUpdateResourceDefinitionGroup.LogModelCheckFailures.ToolTip=Log model validation issues before update
ActionUpdateResourceDefinitionGroup.AbortOnModelCheckFailures.Label=Abort on model check failures
ActionUpdateResourceDefinitionGroup.AbortOnModelCheckFailures.ToolTip=Stop the wave when model validation fails
ActionUpdateResourceDefinitionGroup.DetailedDataTypeChecking.Label=Detailed data type checking
ActionUpdateResourceDefinitionGroup.DetailedDataTypeChecking.ToolTip=Full type/length checks on Data Vault models
ActionUpdateResourceDefinitionGroup.ModelCheckParallelism.Label=Model check parallelism
ActionUpdateResourceDefinitionGroup.ModelCheckParallelism.ToolTip=Max concurrent model validations before the update wave (1–64, default 8). Overlaps high-latency live schema checks across models. Supports Hop variables (example\: '${MODEL_CHECK_PARALLELISM}'). Independent of parallel pipeline copies.
ActionUpdateResourceDefinitionGroup.IgnoreModelCheckWarnings.Label=Ignore warnings
ActionUpdateResourceDefinitionGroup.IgnoreModelCheckWarnings.ToolTip=Omit model-check warnings from the workflow log (including repeated environment findings such as database encoding). Errors still abort when abort-on-check is enabled. Warnings remain in the validation report file when written.
ActionUpdateResourceDefinitionGroup.WriteValidationReport.Label=Write validation report
ActionUpdateResourceDefinitionGroup.WriteValidationReport.ToolTip=Write a Markdown and/or HTML report of aggregated model-check findings (shared environment issues collapsed once) after the pre-check phase
ActionUpdateResourceDefinitionGroup.ValidationReportFolder.Label=Validation report folder
ActionUpdateResourceDefinitionGroup.ValidationReportFolder.ToolTip=Folder for model validation reports (Hop VFS). Default\: '${PROJECT_HOME}/work/reports'
ActionUpdateResourceDefinitionGroup.ValidationReportBaseName.Label=Validation report base name
ActionUpdateResourceDefinitionGroup.ValidationReportBaseName.ToolTip=Optional base name without extension (defaults to group-model-validation-timestamp)
ActionUpdateResourceDefinitionGroup.ValidationReportFormat.Label=Validation report format
ActionUpdateResourceDefinitionGroup.ValidationReportFormat.ToolTip=MARKDOWN, HTML, or BOTH
ActionUpdateResourceDefinitionGroup.UpdateTargetDatabaseStructure.Label=Update target database structure
ActionUpdateResourceDefinitionGroup.UpdateTargetDatabaseStructure.ToolTip=Apply CREATE/ALTER DDL when the model needs it
ActionUpdateResourceDefinitionGroup.FailIfDdlNeeded.Label=Fail if DDL is needed
ActionUpdateResourceDefinitionGroup.FailIfDdlNeeded.ToolTip=Fail instead of applying DDL when structure lag is detected
ActionUpdateResourceDefinitionGroup.DoNotUpdateTargetDatabase.Label=Do not update target database
ActionUpdateResourceDefinitionGroup.DoNotUpdateTargetDatabase.ToolTip=Dry run\: run model checks (and optional DDL when structure update / fail-if-DDL is on) but skip data load pipelines on every DV/BV/DM model. Same semantics as Data Vault Update. With structure update off, only validation runs and reports.
ActionUpdateResourceDefinitionGroup.PublishToCatalog.Label=Publish target tables to catalog
ActionUpdateResourceDefinitionGroup.PublishToCatalog.ToolTip=Publish model table contracts after update
ActionUpdateResourceDefinitionGroup.DataCatalogConnection.Label=Data catalog connection
ActionUpdateResourceDefinitionGroup.DataCatalogConnection.ToolTip=Override the group default catalog connection when empty the group value is used
ActionUpdateResourceDefinitionGroup.EnsureSpecialRecords.Label=Ensure special records (DV)
ActionUpdateResourceDefinitionGroup.EnsureSpecialRecords.ToolTip=Insert ghost/special hub records when configured on the model
ActionUpdateResourceDefinitionGroup.RecordSourceGroup.Label=Record source group (DV)
ActionUpdateResourceDefinitionGroup.RecordSourceGroup.ToolTip=Optional DV_SOURCE group filter for Data Vault Update
ActionUpdateResourceDefinitionGroup.ManageMetrics.Label=Manage vault update metrics (Begin/End)
ActionUpdateResourceDefinitionGroup.ManageMetrics.ToolTip=Assign DV_WORKFLOW_EXECUTION_ID at start and publish a workflow load overview at the end (no separate Begin/End actions needed)
ActionUpdateResourceDefinitionGroup.UseWorkflowLogChannelId.Label=Use workflow log channel id as execution id
ActionUpdateResourceDefinitionGroup.UseWorkflowLogChannelId.ToolTip=When managing metrics\: use the parent workflow log channel id (recommended)
ActionUpdateResourceDefinitionGroup.ExecutionMetricsProfile.Label=Execution metrics profile
ActionUpdateResourceDefinitionGroup.ExecutionMetricsProfile.ToolTip=Shared profile for model load-run metrics and the end-of-wave overview (example\: retail-execution-metrics)
ActionUpdateResourceDefinitionGroup.PublishMetricsToDatabase.Label=Publish overview to OPS database
ActionUpdateResourceDefinitionGroup.PublishMetricsToDatabase.ToolTip=Write workflow_load_overview rows after the wave
ActionUpdateResourceDefinitionGroup.PublishMetricsToCatalog.Label=Publish overview catalog definitions
ActionUpdateResourceDefinitionGroup.PublishMetricsToCatalog.ToolTip=Ensure overview table contracts exist in the FILE catalog
ActionUpdateResourceDefinitionGroup.LogMetricsToWorkflow.Label=Log overview to workflow
ActionUpdateResourceDefinitionGroup.LogMetricsToWorkflow.ToolTip=Write the load overview summary to the workflow log
ActionUpdateResourceDefinitionGroup.WriteMarkdownReport.Label=Write Markdown overview report
ActionUpdateResourceDefinitionGroup.WriteMarkdownReport.ToolTip=Write a Markdown load overview under the report folder
ActionUpdateResourceDefinitionGroup.WriteHtmlReport.Label=Write HTML overview report
ActionUpdateResourceDefinitionGroup.WriteHtmlReport.ToolTip=Write an HTML load overview under the report folder
ActionUpdateResourceDefinitionGroup.ReportOutputFolder.Label=Report output folder
ActionUpdateResourceDefinitionGroup.ReportOutputFolder.ToolTip=Folder for Markdown/HTML overview reports
ActionUpdateResourceDefinitionGroup.ReportFileBaseName.Label=Report file base name
ActionUpdateResourceDefinitionGroup.ReportFileBaseName.ToolTip=Optional base name without extension
ActionUpdateResourceDefinitionGroup.FailIfNoMetricsFound.Label=Fail if no load-run metrics found
ActionUpdateResourceDefinitionGroup.FailIfNoMetricsFound.ToolTip=Fail the action when the overview cannot load correlated load_run rows (default off so load errors are not hidden)
ActionUpdateResourceDefinitionGroup.IncludePipelineDetail.Label=Include pipeline detail in overview
ActionUpdateResourceDefinitionGroup.IncludePipelineDetail.ToolTip=Include per-pipeline metrics in the overview report
ActionUpdateResourceDefinitionGroup.IncludeInsights.Label=Include load insights in overview
ActionUpdateResourceDefinitionGroup.IncludeInsights.ToolTip=Include rule-based load insights in the overview report

