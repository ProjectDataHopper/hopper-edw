ActionUpdateResourceDefinitionGroup.Name=Update resource definition group
ActionUpdateResourceDefinitionGroup.Description=Update all DV, BV, and DM models listed on a resource definition group (order\: DV then BV then DM; list order within each layer). Optionally brackets metrics like Begin/End Vault Update.
ActionUpdateResourceDefinitionGroup.Keywords=resource definition group update data vault business vault dimensional models
ActionUpdateResourceDefinitionGroup.Title=Update resource definition group \: {0}

ActionUpdateResourceDefinitionGroup.Tab.Selection.Label=Selection
ActionUpdateResourceDefinitionGroup.Tab.Selection.ToolTip=Resource definition group and which model layers to include
ActionUpdateResourceDefinitionGroup.Tab.Run.Label=Run
ActionUpdateResourceDefinitionGroup.Tab.Run.ToolTip=Load date, run configurations, parallelism, and optional DV source group filter
ActionUpdateResourceDefinitionGroup.Tab.Operations.Label=Operations
ActionUpdateResourceDefinitionGroup.Tab.Operations.ToolTip=DDL policy, dry run, and Data Vault special-record options
