HopSourceModelDatabaseMeta.label.AuthenticationType=Authentication
HopSourceModelDatabaseMeta.tooltip.AuthenticationType=Basic\: Hop Server username/password. Bearer\: paste a JDBC token (or IdP JWT) as the password. OAuth 2\: the driver fetches a token (client_credentials or refresh_token).
HopSourceModelDatabaseMeta.label.OauthTokenUrl=OAuth2 token URL
HopSourceModelDatabaseMeta.tooltip.OauthTokenUrl=Token endpoint, for example https\://login.example/oauth2/token
HopSourceModelDatabaseMeta.label.OauthGrant=OAuth2 grant
HopSourceModelDatabaseMeta.tooltip.OauthGrant=client_credentials (machine) or refresh_token (paste a refresh token obtained elsewhere)
HopSourceModelDatabaseMeta.label.OauthClientId=OAuth2 client ID
HopSourceModelDatabaseMeta.tooltip.OauthClientId=Confidential client id registered at the identity provider
HopSourceModelDatabaseMeta.label.OauthClientSecret=OAuth2 client secret
HopSourceModelDatabaseMeta.tooltip.OauthClientSecret=Client secret. Leave empty to use the connection password instead.
HopSourceModelDatabaseMeta.label.OauthScope=OAuth2 scope
HopSourceModelDatabaseMeta.tooltip.OauthScope=Space-separated scopes requested at the token endpoint
HopSourceModelDatabaseMeta.label.OauthRefreshToken=OAuth2 refresh token
HopSourceModelDatabaseMeta.tooltip.OauthRefreshToken=Used when grant is refresh_token
