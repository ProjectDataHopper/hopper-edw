# Structured findings (axis / compared / found / why) — keep labels short for multi-line detail panes
ValidationFindingFormatter.Axis=Axis\: {0}
ValidationFindingFormatter.Compared=Compared\: {0}
ValidationFindingFormatter.Found=Found\: {0}
ValidationFindingFormatter.Why=Why it matters\: {0}
ValidationFindingFormatter.Mode.Unknown=UNKNOWN
ValidationFindingFormatter.Baseline.UnnamedVersion=(catalog version)
ValidationFindingFormatter.Axis.BaselineVersion=Working catalog vs baseline catalog version
ValidationFindingFormatter.Axis.WorkingCatalog=Working catalog contracts
ValidationFindingFormatter.Axis.LiveSource=Live source systems vs catalog contract
ValidationFindingFormatter.Axis.TargetDatabase=Target database layout (EDW) vs model
ValidationFindingFormatter.Axis.SourceContract=Source field contract (expected vs actual)
ValidationFindingFormatter.BaselineMissing.Compared=Expected \= baseline version ''{0}'' snapshot; Actual \= working catalog
ValidationFindingFormatter.BaselineMissing.FoundWorkingPresent=Source ''{0}'' is used by models and exists in the working catalog, but is not present in baseline version ''{1}''.
ValidationFindingFormatter.BaselineMissing.FoundNeither=Source ''{0}'' is used by models but was not found in baseline version ''{1}''.
ValidationFindingFormatter.BaselineMissing.Why=This is a catalog version baseline gap, not a missing vault table. Tag a new catalog version that includes this source, or remove the model usage. Then re-validate against that baseline.
ValidationFindingFormatter.WorkingMissing.Compared=Expected \= working catalog record definition for sources used by models
ValidationFindingFormatter.WorkingMissing.Found=Source ''{0}'' is used by models but has no record definition in the working catalog.
ValidationFindingFormatter.WorkingMissing.Why=Publish or generate the source into the Data Catalog (working tree), then re-validate. Vault DDL is a later step and does not fix this.
ValidationFindingFormatter.BothMissing.Compared=Expected \= baseline version ''{0}''; Actual \= working catalog
ValidationFindingFormatter.BothMissing.Found=Source ''{0}'' is used by models but is missing from both the baseline version and the working catalog.
ValidationFindingFormatter.BothMissing.Why=Create the working catalog contract (publish/generate), then tag a baseline version that includes it.
ValidationFindingFormatter.LiveUnavailable.Compared=Catalog source ''{0}'' vs live/physical discovery
ValidationFindingFormatter.LiveUnavailable.FoundGeneric=Live source schema could not be validated against the catalog contract.
ValidationFindingFormatter.LiveUnavailable.Why=Fix connectivity, physical location, or COMPOSITE source-model path so discovery can run. This is not the same as target EDW tables being absent before the first vault update.
ValidationFindingFormatter.TargetDdl.Compared=Model table ''{0}'' in model ''{1}'' vs physical target database
ValidationFindingFormatter.TargetDdl.Found={0} DDL statement(s) are required for the target table to match the model. Preview\: {1}
ValidationFindingFormatter.TargetDdl.Why=The EDW layout lags the model (table missing or columns differ). On a first load this is often normal until Create/Update vault tables runs. It is not a source-catalog field mismatch. Generate a DDL package or run the model update that applies DDL.
ValidationFindingFormatter.TargetDdlFailed.Compared=Model table ''{0}'' vs physical target database
ValidationFindingFormatter.TargetDdlFailed.Found=Could not check target DDL\: {0}
ValidationFindingFormatter.TargetDdlFailed.Why=Resolve target database connectivity, credentials, or permissions, then re-check. This is a target-DB axis failure, not a source contract failure.
ValidationFindingFormatter.FieldDiff.Compared=Field ''{0}'' (expected side vs actual side for this compare mode)
ValidationFindingFormatter.FieldDiff.Found=Field ''{0}'' differs\: {1}
ValidationFindingFormatter.FieldDiff.Why=Values are expected (baseline/catalog contract) \u2192 actual (live discovery or compared catalog side). Align catalog, models, or source as appropriate.
ValidationFindingFormatter.Context.BaselineTag=baseline catalog version ''{0}''
ValidationFindingFormatter.Context.WorkingCatalog=baseline \= current working catalog (contract of record for this run)
ValidationFindingFormatter.Context.Line=Compare mode\: {0}; {1}
ValidationFindingFormatter.Summary.What.WorkingVsVersion=Working catalog vs baseline catalog version ''{0}''
ValidationFindingFormatter.Summary.What.VersionVsVersion=Catalog version ''{0}'' vs catalog version ''{1}''
ValidationFindingFormatter.Summary.What.LiveVsVersion=Live sources vs catalog version ''{0}''
ValidationFindingFormatter.Summary.What.LiveVsWorking=Live sources vs working catalog contracts
ValidationFindingFormatter.Summary.What.HarvestRun=Persisted schema harvest run ''{0}'' (no live rediscovery)
ValidationFindingFormatter.Summary.Expected.Harvest=Catalog contract used when the harvest ran
ValidationFindingFormatter.Summary.Actual.Harvest=Harvest snapshot ''{0}''
ValidationFindingFormatter.Summary.Expected.Version=Catalog version ''{0}'' (immutable snapshot — not modified by validation)
ValidationFindingFormatter.Summary.Expected.Working=Current working catalog (contract of record for this run)
ValidationFindingFormatter.Summary.Actual.Working=Working catalog (current project contracts)
ValidationFindingFormatter.Summary.Actual.Live=Live / physical source systems
ValidationFindingFormatter.Summary.Actual.Version=Catalog version ''{0}''
ValidationFindingFormatter.Kind.Unknown=Finding
ValidationFindingFormatter.Kind.SOURCE_UNAVAILABLE=Live source could not be validated
ValidationFindingFormatter.Kind.SOURCE_UNREADABLE=Live source is unreadable
ValidationFindingFormatter.Kind.BASELINE_CONTRACT_MISSING=Source missing from baseline version
ValidationFindingFormatter.Kind.WORKING_CONTRACT_MISSING=Source missing from working catalog
ValidationFindingFormatter.Kind.FIELD_ADDED=New field on source
ValidationFindingFormatter.Kind.FIELD_REMOVED=Field removed from source
ValidationFindingFormatter.Kind.FIELD_TYPE_CHANGED=Field type or length changed
ValidationFindingFormatter.Kind.PRIMARY_KEY_CHANGED=Primary key composition changed
ValidationFindingFormatter.Kind.MAPPING_BROKEN=Model mapping is broken
ValidationFindingFormatter.Kind.MODEL_ATTRIBUTE_NARROWER=Model attribute is narrower than catalog
ValidationFindingFormatter.Kind.TARGET_DDL_REQUIRED=Target table needs DDL

SchemaValidationReportFormatter.Action.Pass=No action required; schema validation passed.
SchemaValidationReportFormatter.Action.BaselineMissing=Tag a new catalog version that includes the missing sources (or remove unused model usages), then re-validate against that baseline. This is not a missing vault table.
SchemaValidationReportFormatter.Action.WorkingMissing=Publish or generate the missing source into the working Data Catalog, then re-validate.
SchemaValidationReportFormatter.Action.LiveUnavailable=Fix live source connectivity, file paths, or composite source-model settings so discovery can run.
SchemaValidationReportFormatter.Action.TargetDdl=Generate a reviewable target DDL package or run Data Vault update so EDW tables match the models.
SchemaValidationReportFormatter.Action.FieldContract=Review field-level contract differences (expand models from the catalog, refresh the catalog from source, or fix mappings) using the proposals on each finding.
SchemaValidationReportFormatter.Action.CriticalGeneric=Resolve each critical finding using the steps under What to do. Baseline gaps, live discovery failures, and target DDL are different problems.
SchemaValidationReportFormatter.Action.WarningGeneric=Review warning-level findings and lineage notes before promoting. Loads may continue if the gate is configured to fail only on critical issues.

