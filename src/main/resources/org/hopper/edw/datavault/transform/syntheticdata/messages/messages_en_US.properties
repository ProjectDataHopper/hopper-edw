SyntheticData.Name=Synthetic data
SyntheticData.Description=Generates seeded synthetic rows from sequences, choices, ranges, templates and parent rows
SyntheticData.keyword=synthetic,fake,generator,sample,seed,rows
SyntheticData.Group.Generation=Generation
SyntheticData.Group.Document=Document
SyntheticData.Group.Populations=Populations
SyntheticData.Group.Paths=Paths
SyntheticData.Group.Fields=Fields
SyntheticData.Group.Overrides=Overrides
SyntheticData.Group.Xml=XML structure
SyntheticData.Seed.Label=Seed
SyntheticData.Seed.Tooltip=Numeric expression for this transform''s random seed. Use a different expression on each copy, for example '${SEED}'+3.
SyntheticData.Mode.Label=Cardinality
SyntheticData.Mode.Tooltip=COUNT emits a fixed number of rows. COMBINE unions id populations. PER_PARENT, PATHS and HIERARCHY expand an info stream. UNIQUE_PAIRS samples distinct pairs.
SyntheticData.RowCount.Label=Row count
SyntheticData.RowCount.Tooltip=Numeric expression used by COUNT. Example\: max(50, div('${CUSTOMERS}', 100)). Integer division uses div().
SyntheticData.Fraction.Label=Parent fraction
SyntheticData.Fraction.Tooltip=Fraction of candidate parent rows to keep, from 0 to 1. 1 keeps every parent.
SyntheticData.IncludeFirst.Label=Always include the first candidate
SyntheticData.IncludeFirst.Tooltip=When sampling parents, always keep candidate index 0.
SyntheticData.MinRows.Label=Minimum parent rows
SyntheticData.MinRows.Tooltip=Lower bound on the number of sampled parents. Example\: 1.
SyntheticData.MinChildren.Label=Minimum children
SyntheticData.MinChildren.Tooltip=Minimum child rows per selected parent for PER_PARENT.
SyntheticData.MaxChildren.Label=Maximum children
SyntheticData.MaxChildren.Tooltip=Maximum child rows per selected parent for PER_PARENT.
SyntheticData.SelectorField.Label=Selector field
SyntheticData.SelectorField.Tooltip=Parent field whose value selects a PATHS branch or a HIERARCHY status filter.
SyntheticData.ParentKey.Label=Parent key
SyntheticData.ParentKey.Tooltip=Parent field joined to the child info stream in HIERARCHY mode.
SyntheticData.ChildKey.Label=Child key
SyntheticData.ChildKey.Tooltip=Child field joined to the parent key in HIERARCHY mode.
SyntheticData.IncludeStatuses.Label=Include values
SyntheticData.IncludeStatuses.Tooltip=Pipe-separated selector values kept as HIERARCHY candidates. Example\: SHIPPED|DELIVERED.
SyntheticData.FallbackStatuses.Label=Fallback values
SyntheticData.FallbackStatuses.Tooltip=Used only when no parent matches Include values. Example\: NEW.
SyntheticData.SplitMinChildren.Label=Split when child count is at least
SyntheticData.SplitMinChildren.Tooltip=HIERARCHY splits a parent's children into two groups when this count is reached and the split probability hits. 0 disables the split.
SyntheticData.SplitProbability.Label=Split probability
SyntheticData.SplitProbability.Tooltip=Probability from 0 to 1 of splitting a large child list in half.
SyntheticData.PairCount.Label=Pair count
SyntheticData.PairCount.Tooltip=How many distinct pairs UNIQUE_PAIRS should emit. Capped at the cartesian product.
SyntheticData.PairLeftField.Label=Left pair field
SyntheticData.PairLeftField.Tooltip=Field read from the pairs-left info stream. Leave empty to use the integer range instead.
SyntheticData.PairRightField.Label=Right pair field
SyntheticData.PairRightField.Tooltip=Field read from the pairs-right info stream.
SyntheticData.PairLeftStart.Label=Left range start
SyntheticData.PairLeftStart.Tooltip=First integer of the left range when no pairs-left stream is connected.
SyntheticData.PairLeftCount.Label=Left range count
SyntheticData.PairLeftCount.Tooltip=How many integers to take from the left range start.
SyntheticData.PairRightStart.Label=Right range start
SyntheticData.PairRightStart.Tooltip=First integer of the right range when no pairs-right stream is connected.
SyntheticData.PairRightCount.Label=Right range count
SyntheticData.PairRightCount.Tooltip=How many integers to take from the right range start.
SyntheticData.ParentsTransform.Label=Parents transform
SyntheticData.ParentsTransform.Tooltip=Info hop that supplies parent rows. Drawing the hop fills this name.
SyntheticData.ChildrenTransform.Label=Children transform
SyntheticData.ChildrenTransform.Tooltip=Info hop of detail rows joined in HIERARCHY mode.
SyntheticData.PairsLeftTransform.Label=Pairs left transform
SyntheticData.PairsLeftTransform.Tooltip=Info hop of left-hand pair values.
SyntheticData.PairsRightTransform.Label=Pairs right transform
SyntheticData.PairsRightTransform.Tooltip=Info hop of right-hand pair values.
SyntheticData.DocumentFormat.Label=Document
SyntheticData.DocumentFormat.Tooltip=NONE keeps rows only. XML also writes a nested document while the flat rows stay on the output.
SyntheticData.DocumentFilename.Label=Document filename
SyntheticData.DocumentFilename.Tooltip=VFS path of the XML file. Variables are supported, for example '${PROJECT_HOME}/files/asn_${WAVE}.xml'.
SyntheticData.DocumentRoot.Label=Root element
SyntheticData.DocumentRoot.Tooltip=Root XML element name. Example\: AdvancedShipmentNotices.
SyntheticData.DocumentRootAttributes.Label=Root attributes
SyntheticData.DocumentRootAttributes.Tooltip=Semicolon-separated name\=value pairs. Values support variables, for example wave\='${WAVE}'.
SyntheticData.DocumentEncoding.Label=Encoding
SyntheticData.DocumentEncoding.Tooltip=XML encoding. Default UTF-8.
SyntheticData.Populations.Label=Id populations (COMBINE). A count of 0 is skipped. SAMPLE draws unique ids from From..To and emits them in sorted order.
SyntheticData.Paths.Label=Status paths. The first matching When value wins. Use * as the fallback. Steps are separated by |. An empty step list emits nothing.
SyntheticData.Fields.Label=Output fields, evaluated left to right. Unpublished fields stay available to later fields and to the XML document. Arguments are key\=value pairs separated by semicolons.
SyntheticData.Overrides.Label=When parent and child indexes match, replace one field or force the child count. Indexes are 0-based. An empty index matches every row.
SyntheticData.XmlNodes.Label=XML tree. GROUP repeats an element for each distinct group field. ELEMENT writes one tag from the first row of the group. WRAPPER is a tag with no attributes. ROW writes one tag per flat row. Attributes are attr\:field pairs separated by commas.
