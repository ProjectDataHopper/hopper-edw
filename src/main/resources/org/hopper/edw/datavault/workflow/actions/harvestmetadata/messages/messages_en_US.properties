ActionHarvestSourceMetadata.Name=Harvest source metadata
ActionHarvestSourceMetadata.Description=Discover live source schemas for a resource definition group, store harvest history (snapshots and drift), without rewriting the catalog or loading the EDW
ActionHarvestSourceMetadata.Keywords=metadata harvest schema drift catalog source OPS observation
ActionHarvestSourceMetadata.Title=Harvest source metadata
ActionHarvestSourceMetadata.Group.Label=Resource definition group
ActionHarvestSourceMetadata.Group.ToolTip=Hop metadata group whose DV/BV/DM models define which catalog sources to harvest
ActionHarvestSourceMetadata.CatalogConnection.Label=Data catalog connection
ActionHarvestSourceMetadata.CatalogConnection.ToolTip=Optional catalog connection override (empty uses the group default / model connections)
ActionHarvestSourceMetadata.BaselineMode.Label=Expected baseline
ActionHarvestSourceMetadata.BaselineMode.ToolTip=WORKING_CATALOG compares live discovery to the current catalog contract; CATALOG_VERSION uses a frozen tag as expected
ActionHarvestSourceMetadata.BaselineVersion.Label=Baseline catalog version
ActionHarvestSourceMetadata.BaselineVersion.ToolTip=Catalog version tag when baseline mode is CATALOG_VERSION (supports variables)
ActionHarvestSourceMetadata.RecordSourceGroup.Label=Record source group filter
ActionHarvestSourceMetadata.RecordSourceGroup.ToolTip=Optional DV_SOURCE group tag filter (for example hourly or daily). Empty means all sources in the resource group
ActionHarvestSourceMetadata.ConnectionFilter.Label=Source database filter
ActionHarvestSourceMetadata.ConnectionFilter.ToolTip=Optional Hop database connection name; when set only DATABASE sources on that connection are harvested
ActionHarvestSourceMetadata.PersistHistory.Label=Persist harvest history
ActionHarvestSourceMetadata.PersistHistory.ToolTip=When enabled, write schema_harvest_run / subject / field / change rows to the history database
ActionHarvestSourceMetadata.HistoryDatabase.Label=History database
ActionHarvestSourceMetadata.HistoryDatabase.ToolTip=Ops connection for harvest history (retail\: OPS). Empty uses SCHEMA_HARVEST_DATABASE or OPS when present
ActionHarvestSourceMetadata.HistorySchema.Label=History schema
ActionHarvestSourceMetadata.HistorySchema.ToolTip=Optional schema for harvest history tables (empty \= connection default database)
ActionHarvestSourceMetadata.AutoCreateTables.Label=Auto-create history tables
ActionHarvestSourceMetadata.AutoCreateTables.ToolTip=Create schema_harvest_* tables when missing
ActionHarvestSourceMetadata.PublishCatalogDefinitions.Label=Publish catalog definitions
ActionHarvestSourceMetadata.PublishCatalogDefinitions.ToolTip=Upsert operations RecordDefinitions for harvest history tables when a catalog connection is set
ActionHarvestSourceMetadata.FailOnPersistError.Label=Fail on persist error
ActionHarvestSourceMetadata.FailOnPersistError.ToolTip=When enabled, the action fails if history publish fails
ActionHarvestSourceMetadata.FailOnDiscoveryErrors.Label=Fail on discovery errors
ActionHarvestSourceMetadata.FailOnDiscoveryErrors.ToolTip=When enabled, FAILED or PARTIAL harvest status fails the action. Schema drift alone never fails (use the schema gate for policy)
ActionHarvestSourceMetadata.ReportOutputPath.Label=Report output path
ActionHarvestSourceMetadata.ReportOutputPath.ToolTip=Optional folder or .md file path for a Markdown harvest report (Hop VFS). Empty means log only
ActionHarvestSourceMetadata.Error.MissingGroup=Resource definition group is required
ActionHarvestSourceMetadata.Error.HarvestFailed=Schema harvest failed\: {0}
ActionHarvestSourceMetadata.Error.NoHistoryDatabase=No harvest history database resolved (set History database, SCHEMA_HARVEST_DATABASE, or OPS)
ActionHarvestSourceMetadata.Error.DiscoveryErrors=Schema harvest finished with discovery errors (status\={0}, error subjects\={1})
ActionHarvestSourceMetadata.Error.ReportWriteFailed=Failed to write harvest report\: {0}
ActionHarvestSourceMetadata.Info.Complete=Schema harvest complete\: status\={0}, subjects\={1}, withChanges\={2}, changeEvents\={3}
ActionHarvestSourceMetadata.Info.PersistResult=Harvest history publish {0}\: {1}
ActionHarvestSourceMetadata.Info.ReportWritten=Harvest report written to {0}
