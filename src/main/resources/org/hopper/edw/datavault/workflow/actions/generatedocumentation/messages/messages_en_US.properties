ActionGenerateProjectDocumentation.Keywords=documentation,html,svg,search,project,catalog,lineage
ActionGenerateProjectDocumentation.Target.Label=Target folder
ActionGenerateProjectDocumentation.Target.ToolTip=Output folder for the static HTML set (variables supported), for example '${PROJECT_HOME}'/work/documentation
ActionGenerateProjectDocumentation.Source.Label=Source folder (optional)
