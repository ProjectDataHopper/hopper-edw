ActionGenerateProjectDocumentation.Scope.Label=Scope
ActionGenerateProjectDocumentation.Scope.ToolTip=PROJECT documents files under the source folder. ENVIRONMENT also lists non-secret environment variables.
ActionGenerateProjectDocumentation.Theme.Label=CSS theme
ActionGenerateProjectDocumentation.Theme.ToolTip=Copies the selected sample to assets/css/hop-doc.css (default, compact, high-contrast)
ActionGenerateProjectDocumentation.Parameters.Label=Include parameters
ActionGenerateProjectDocumentation.Notes.Label=Include canvas notes (Markdown rendered as HTML)
ActionGenerateProjectDocumentation.Metadata.Label=Include metadata objects
ActionGenerateProjectDocumentation.Catalog.Label=Include catalog record definitions
ActionGenerateProjectDocumentation.Lineage.Label=Include source-to-target lineage
ActionGenerateProjectDocumentation.DarkSvg.Label=Generate dark-theme SVG copies
ActionGenerateProjectDocumentation.Log.Wrote=Wrote project documentation to {0} ({1} pages, {2} search entries)
ActionGenerateProjectDocumentation.Error.Failed=Project documentation generation failed
