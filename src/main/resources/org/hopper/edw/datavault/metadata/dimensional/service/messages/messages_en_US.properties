DimensionalModelService.name=Dimensional model service
DimensionalModelService.description=Expose a dimensional model (.hdm) as a JDBC schema on Hop Server, with masking and a query audit table
DimensionalModelServiceEditor.Name.Label=Name
DimensionalModelServiceEditor.Enabled.Label=Enabled
DimensionalModelServiceEditor.Description.Label=Description
DimensionalModelServiceEditor.ModelFilename.Label=Dimensional model file
DimensionalModelServiceEditor.ModelFilename.Tooltip=Server-side path to the .hdm file. Variables such as '${PROJECT_HOME}' are allowed. Clients only see the service name.
DimensionalModelServiceEditor.DefaultRowLimit.Label=Default row limit
DimensionalModelServiceEditor.DefaultRowLimit.Tooltip=Applied when the client omits rowLimit. 0 means no default unless the max is set.
DimensionalModelServiceEditor.MaxRowLimit.Label=Max row limit
DimensionalModelServiceEditor.MaxRowLimit.Tooltip=Hard cap per query. 0 means unlimited. Always enforced when greater than zero.
DimensionalModelServiceEditor.QueryTimeout.Label=Query timeout (seconds)
DimensionalModelServiceEditor.QueryTimeout.Tooltip=Warehouse statement timeout. 0 leaves the JDBC driver default.
DimensionalModelServiceEditor.AllowSchemaMetadata.Label=Allow schema metadata
DimensionalModelServiceEditor.AllowSchemaMetadata.Tooltip=When checked, clients can list tables, columns, and foreign keys.
DimensionalModelServiceEditor.AllowedUsers.Label=Allowed users
DimensionalModelServiceEditor.AllowedUsers.Tooltip=One Hop Server user name per line. Leave empty to allow every user who can run on this server.
DimensionalModelServiceEditor.MaskingPolicy.Label=Masking policy
DimensionalModelServiceEditor.MaskingPolicy.Tooltip=Safe rejects filters and expressions on masked columns. Display pushes the statement down and masks result cells.
DimensionalModelServiceEditor.AuditEnabled.Label=Audit queries
DimensionalModelServiceEditor.AuditEnabled.Tooltip=Write one row per query, including rejected queries. If the insert fails, the client receives no rows.
DimensionalModelServiceEditor.AuditConnection.Label=Audit connection
DimensionalModelServiceEditor.AuditSchema.Label=Audit schema
DimensionalModelServiceEditor.AuditTable.Label=Audit table
DimensionalModelServiceEditor.StoreSqlVerbatim.Label=Store query text verbatim
DimensionalModelServiceEditor.StoreSqlVerbatim.Tooltip=When unchecked, string and numeric literals in the logged SQL are replaced with ?.
DimensionalModelServiceEditor.CreateAuditTable.Label=Create audit table
DimensionalModelServiceEditor.CreateAuditTable.Tooltip=Create edw_dimensional_query_audit on the audit connection.
DimensionalModelServiceEditor.CreateAuditTable.Created=Created audit table {0}.
DimensionalModelServiceEditor.CreateAuditTable.Missing=The audit table is missing. Queries fail until you create it while auditing is enabled.
DimensionalModelServiceEditor.Help.Label=This name is the JDBC schema, next to any Source model service. URL\: jdbc\:hop-hsm\://user\:pass@host\:port/<this name>
