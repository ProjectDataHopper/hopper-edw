BusinessVaultConfiguration.FunctionalTimestampField.Label=Functional timestamp field
BusinessVaultConfiguration.FunctionalTimestampField.ToolTip=Satellite column used as the functional timeline. Leave empty to use the Data Vault load date field, then the load-date fallback below.
BusinessVaultConfiguration.LoadDateFieldFallback.Label=Load date fallback field
