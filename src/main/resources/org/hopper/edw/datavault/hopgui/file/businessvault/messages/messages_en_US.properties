HopGuiBvScd2TableDialog.ParentHub.Tooltip=The hub this SCD2 timeline is for. Every satellite and source query is sorted and merged on that hub''s hash key (plus the functional timestamp). Origin does not matter. Leave empty to infer from linked satellites.
