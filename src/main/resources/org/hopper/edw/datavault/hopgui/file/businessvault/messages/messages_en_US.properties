HopGuiBvScd2TableDialog.LoadHubBusinessKeys.Tooltip=When Include hub business keys is selected, write those key columns to the Business Vault table. Uncheck to keep them on the stream for SQL calculations only.
HopGuiBvScd2TableDialog.BuildMode.Label=Build mode
HopGuiBvScd2TableDialog.BuildMode.Tooltip=Full rebuild reads all satellite history and reloads the Business Vault table. Incremental reads only new satellite rows since the last target watermark and updates open SCD2 versions.
HopGuiBvScd2TableDialog.HashKeyPartitions.Label=Hash-key partitions
HopGuiBvScd2TableDialog.HashKeyPartitions.Tooltip=Split a Full rebuild into 4, 8, or 16 hash-key parts so each satellite read is a smaller ORDER BY. A workflow truncates the target once, then runs the SCD2 pipeline with '${PARTITION_COUNT}' and '${PARTITION_NUMBER}'. Table Output and Native bulk append; Staging file writes one CSV set per partition then bulk-loads. Incremental mode cannot be partitioned.
HopGuiBvScd2TableDialog.SqlExpressionCopies.Label=SQL Expression copies
HopGuiBvScd2TableDialog.SqlExpressionCopies.Tooltip=Parallel copies of the generated SQL Expression transform after collapse. Rows are round-robin distributed. Enter a number (1, 2, 4, 8, \u2026) or a variable such as '${SQL_EXPRESSION_COPIES}' so each environment can set its own value. Empty means 1 copy.
HopGuiBvScd2TableDialog.FunctionalTimestamp.Label=Functional timestamp field
HopGuiBvScd2TableDialog.IncrementalWatermark.Label=Incremental watermark field
HopGuiBvScd2TableDialog.IncrementalWatermark.Tooltip=Leave empty to use the resolved functional timestamp field. When build mode is Incremental, satellite reads filter on rows newer than MAX(watermark field) in the target table.
