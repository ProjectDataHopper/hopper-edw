HopGuiBvScd2TableDialog.IncludeHubBusinessKeys.Label=Include hub business keys
HopGuiBvScd2TableDialog.IncludeHubBusinessKeys.Tooltip=Join parent hub business key column(s) onto the collapsed SCD2 stream immediately before SQL calculations. Keys are identity (not version drivers). Requires Include hash key. Use Load hub business keys to write them to the table. The SCD2 merge/repeat/incremental path is unchanged.
