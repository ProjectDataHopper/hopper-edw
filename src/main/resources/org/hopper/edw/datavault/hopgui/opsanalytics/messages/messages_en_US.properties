OpsAnalyticsDialog.Title=Create operational analytics
OpsAnalyticsDialog.Group=Operational analytics
OpsAnalyticsDialog.OpsConnection.Label=OPS connection
OpsAnalyticsDialog.OpsConnection.Tooltip=Database that holds the operational tables (load metrics, quality history, schema harvest).
OpsAnalyticsDialog.OpsSchema.Label=OPS schema
OpsAnalyticsDialog.OpsSchema.Tooltip=Schema of the operational tables. Retail uses dv_ops.
OpsAnalyticsDialog.DvConnection.Label=Data Vault target
OpsAnalyticsDialog.DvConnection.Tooltip=Connection for the raw vault. Leave blank to use the OPS connection. Put the schema ops_dv on that connection.
OpsAnalyticsDialog.BvConnection.Label=Business Vault target
OpsAnalyticsDialog.BvConnection.Tooltip=Connection for the Business Vault. Leave blank to use the OPS connection. Put the schema ops_bv on that connection.
OpsAnalyticsDialog.DmConnection.Label=Dimensional target
OpsAnalyticsDialog.DmConnection.Tooltip=Connection for the dimensional model. Leave blank to use the OPS connection. Put the schema ops_dm on that connection.
OpsAnalyticsDialog.Folder.Label=Folder
OpsAnalyticsDialog.Folder.Tooltip=Project folder for the generated models and workflows. Default is '${PROJECT_HOME}/models/ops-analytics'.
OpsAnalyticsDialog.GroupName.Label=Resource definition group
OpsAnalyticsDialog.GroupName.Tooltip=Name of the group that lists the generated models. Default is ops-analytics.
OpsAnalyticsDialog.PipelineRunConfiguration.Label=Pipeline run configuration
OpsAnalyticsDialog.PipelineRunConfiguration.Tooltip=Run configuration for the analytics update pipelines. The default, ops-analytics-pipeline, has no data profile and writes execution information to ops-analytics-executions instead of the OPS executions table.
OpsAnalyticsDialog.WorkflowRunConfiguration.Label=Workflow run configuration
OpsAnalyticsDialog.WorkflowRunConfiguration.Tooltip=Run configuration for the analytics update workflows. The default, ops-analytics-workflow, writes execution information to ops-analytics-executions instead of the OPS executions table.
OpsAnalyticsDialog.IncludeExecutions.Label=Include hop_executions
OpsAnalyticsDialog.IncludeExecutions.Tooltip=Add the Hop execution information table. It is not assumed to share keys with workflow_execution_id.
OpsAnalyticsDialog.ExecutionSchema.Label=Execution schema
OpsAnalyticsDialog.ExecutionSchema.Tooltip=Schema of hop_executions. Leave blank for the connection default schema.
OpsAnalyticsDialog.Replace.Label=Replace existing models
OpsAnalyticsDialog.Replace.Tooltip=Overwrite models already in the chosen folder and the ops-analytics configurations. You will be asked to confirm.
OpsAnalyticsDialog.Replace.Refuse=That folder already exists. Check Replace existing models to overwrite it.
OpsAnalyticsDialog.Replace.Confirm=Replace the operational analytics models in this folder?
OpsAnalyticsDialog.Probe.Warning=The OPS database could not be read. Generation will still use the known table catalog.\n\n{0}
OpsAnalyticsDialog.Probe.Missing=These OPS tables were not found. The models will still be generated, and the first load will see empty sources.\n\n{0}
OpsAnalyticsDialog.Validate.Connection=Choose the OPS database connection.
OpsAnalyticsDialog.Validate.Folder=Choose a folder inside the project.
OpsAnalyticsDialog.Validate.Group=Name the resource definition group.
OpsAnalyticsDialog.Error.Title=Operational analytics
OpsAnalyticsDialog.Error.Message=Operational analytics could not be created.
OpsAnalyticsGuiPlugin.Menu.Text=Create operational analytics...
OpsAnalyticsGuiPlugin.Menu.Tooltip=Generate a source model, Data Vault, Business Vault, dimensional model, and load workflows from the OPS database.
