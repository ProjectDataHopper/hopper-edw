#
# Curated plugin list for the Data Hopper community marketplace repository.
# hop-marketplace-repo.yaml points here with catalogUrl. Import that repository
# definition; do not import this catalog by itself.
#
schemaVersion: "1.0"
kind: hop-marketplace-catalog

plugins:
  - groupId: org.hopper
    artifactId: hopper-edw
    version: 1.1.0
    minHopVersion: "2.20.0"
    name: Data Hopper EDW
    category: Community
    description: >
      Apache Hop plugins to build an Enterprise Data Warehouse: source models,
      Data Catalog, Data Vault 2.0, Business Vault, dimensional models, quality,
      and lineage.
    installPath: plugins/misc/hopper-edw
